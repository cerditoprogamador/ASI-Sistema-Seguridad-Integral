    /* ═══════════════════════════════════════════════════════════
       ASISA — Libro de novedades
       Mundo visual y justificación de cada token: DESIGN.md
       Contrato de dirección: .impeccable/surfaces/app.md
       Los nombres de token heredados (brand/aqua/plum/tang) se

    ═══════════════════════════════════════════════════════════ */
    tailwind.config = {

        extend: {
          colors: {

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ═══════ REGLA CERO ═══════
       Radio cero en todo el sistema. Se aplica de raíz en vez de editar
       cada utilitario heredado: es una regla del mundo, no una excepción. */
    *, *::before, *::after { border-radius: 0 !important; }

    html, body {
      height: 100%;
      font-family: "Archivo", system-ui, sans-serif;
      font-variation-settings: "wdth" 100;
      background: #101A33;
      color: #141E33;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
      text-underline-offset: 3px;
    }
    #root { min-height: 100vh; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
    input, textarea, select { font-family: inherit; font-size: 17px; }
    .tnum, input, .dato { font-variant-numeric: tabular-nums; }
    svg { display: block; }

    /* ═══════ SUPERFICIES DEL NAVEGADOR ═══════
       Ninguna queda en default: son la señal más barata de que la
       página fue dibujada y no ensamblada. */
    ::selection { background: rgba(75,58,122,.20); color: #141E33; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #C3CEE2; }
    .sobre-tapa ::-webkit-scrollbar-thumb { background: #9C7B26; }
    input, textarea { caret-color: #A6272E; }
    :focus-visible, .clay-btn:focus-visible, .focus-ring:focus-visible {
      outline: 2px solid #A6272E; outline-offset: 2px;
    }

    /* ═══════ EL LECHO REGLADO ═══════
       El reglado es real: 28px de renglón, hairline a 1 device pixel.
       El contenido se apoya en él en vez de flotar sobre un fondo. */
    .lecho {
      background-color: #DDE0E4;
      background-image: repeating-linear-gradient(to bottom, #C2CBD6 0 1px, transparent 1px 28px);
      background-position: 0 -1px;
    }
    .reglado {
      background-image: repeating-linear-gradient(to bottom, rgba(194,203,214,.85) 0 1px, transparent 1px 28px);
      background-position: 0 27px;
    }

    /* ═══════ LA HOJA ═══════
       Profundidad = papel. Offset real más blur suave; nada se infla,
       nada lleva halo de color sin offset.
       Los nombres .clay* se conservan para que el marcado existente
       herede el mundo nuevo sin reescribirse. */
    .clay, .hoja {
      background: #ECEEF0;
      box-shadow:
        0 1px 0 rgba(0,0,0,.05),
        0 10px 22px -10px rgba(0,0,0,.26);
      border-top: 1px solid rgba(255,255,255,.75);
    }
    .clay-sm, .hoja-sm {
      background: #ECEEF0;
      box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 5px 12px -6px rgba(0,0,0,.22);
      border-top: 1px solid rgba(255,255,255,.7);
    }
    /* Campo de entrada: una casilla hundida en la hoja, con su regla al pie */
    .clay-inset, .casilla {
      background: #F5F6F7;
      box-shadow: inset 0 1px 2px rgba(0,0,0,.10);
      border: 1px solid #C2CBD6;
      border-bottom: 2px solid #32405E;
    }
    .clay-tint { box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 8px 18px -10px rgba(0,0,0,.24); }

    /* ═══════ EL FILETE DE MARGEN ═══════
       El único rojo de la aplicación, y por eso el que manda. */
    .filete { box-shadow: inset 2px 0 0 #A6272E; }
    .canaleta {
      border-right: 1px solid #C2CBD6;
      color: #8894AE;
      font-variant-numeric: tabular-nums;
      font-size: 11px;
      font-variation-settings: "wdth" 92;
      letter-spacing: .06em;
    }

    /* ═══════ RÓTULO DE APPARATUS ═══════ */
    .rotulo {
      font-size: 12px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .14em; font-variation-settings: "wdth" 92;
      color: #546282;
    }
    .display {
      font-weight: 800; text-transform: uppercase; letter-spacing: -.02em;
      font-variation-settings: "wdth" 112; line-height: 1.02;
    }
    .folio {
      font-weight: 700; font-variant-numeric: tabular-nums;
      font-variation-settings: "wdth" 118; letter-spacing: .01em;
    }

    /* ═══════ BOTONES ═══════
       La acción primaria es la lámina dorada del lomo sobre la tela navy.
       Se hunde un pixel al presionarse: una tecla de máquina, no una burbuja. */
    .clay-btn {
      transition: background-color .16s linear, color .16s linear, box-shadow .16s linear, transform .12s linear;
      box-shadow: 0 1px 0 rgba(0,0,0,.16);
    }
    .clay-btn:active:not(:disabled) { transform: translateY(1px); box-shadow: none; }
    .clay-btn:disabled { cursor: not-allowed; box-shadow: none; }
    .clay-press { transition: transform .12s linear; }
    .clay-press:active { transform: translateY(1px); }

    /* ═══════ EL SELLO ═══════
       El único momento autorado de toda la aplicación: el asentado.
       Cae una vez, rota, resuelve el desenfoque y se queda. */
    @keyframes asentar {
      0%   { opacity: 0; transform: scale(1.22) rotate(-11deg); filter: blur(3px); }
      55%  { opacity: .95; filter: blur(0); }
      100% { opacity: .82; transform: scale(1) rotate(-4.5deg); filter: blur(0); }
    }
    .sello {
      color: #4B3A7A;
      border: 3px solid currentColor;
      animation: asentar .52s cubic-bezier(.2,.9,.3,1) both;
      mix-blend-mode: multiply;
    }

    /* ═══════ MOVIMIENTO ═══════
       Un solo eje, amortiguado, sin rebote. */
    @keyframes fadeIn   { from { opacity:0 } to { opacity:1 } }
    @keyframes slideUp  { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform:none } }
    @keyframes slideDn  { from { opacity:0; transform: translateY(-8px) } to { opacity:1; transform:none } }
    @keyframes sheetUp  { from { transform: translateY(100%) } to { transform: translateY(0) } }
    @keyframes popIn    { from { opacity:0; transform: translateY(6px) } to { opacity:1; transform:none } }
    @keyframes spin     { to { transform: rotate(360deg) } }
    @keyframes breathe  { 0%,100% { opacity:1 } 50% { opacity:.4 } }
    @keyframes shimmer  { 0% { background-position: -420px 0 } 100% { background-position: 420px 0 } }
    .a-fade  { animation: fadeIn .2s linear both }
    .a-up    { animation: slideUp .18s cubic-bezier(.2,.9,.3,1) both }
    .a-dn    { animation: slideDn .16s cubic-bezier(.2,.9,.3,1) both }
    .a-sheet { animation: sheetUp .22s cubic-bezier(.2,.9,.3,1) both }
    .a-pop   { animation: popIn .18s cubic-bezier(.2,.9,.3,1) both }
    .a-spin  { animation: spin .9s linear infinite; display:inline-block }
    .a-pulse { animation: breathe 1.9s ease-in-out infinite }
    .skeleton {
      background: linear-gradient(90deg, #DDE0E4 25%, #ECEEF0 50%, #DDE0E4 75%);
      background-size: 840px 100%;
      animation: shimmer 1.5s infinite linear;
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
      .sello { opacity: .82; transform: rotate(-4.5deg); }
    }

    /* ═══════ UTILIDADES ═══════ */
    .scroll-y { height: 100%; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    .sig-canvas { cursor: crosshair; display: block; touch-action: none; }
    .no-select { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

        repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px);
    }
    /* Casillero fijo: las cifras nunca reflowan ni empujan lo que tienen al lado */
    .casillero { font-variant-numeric: tabular-nums; display: inline-block; text-align: right; }
  </style>

const fmtHora  = (d) => new Date(d).toLocaleTimeString("es-AR", { hour:"2-digit", minute:"2-digit" });

/* Distancia Haversine en metros — usada para validar el geocerco contra la posición real del dispositivo */
function distanciaMetros(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

/* Hook: posición real del dispositivo vía navigator.geolocation (PRD §2 — validación de geocerco) */
function useDeviceGeolocation() {
  const [coords, setCoords] = useState(null);
  const [error, setError]   = useState(null);
  const [seq, setSeq]       = useState(0); // fuerza reintento

  useEffect(() => {
    if (!navigator.geolocation) { setError("unsupported"); return; }
    setError(null);
    const id = navigator.geolocation.watchPosition(
      (pos) => {
        setCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy });
        setError(null);
      },
      (err) => setError(err.code === 1 ? "denied" : err.code === 2 ? "unavailable" : "timeout"),
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
    );
    return () => navigator.geolocation.clearWatch(id);
  }, [seq]);

  return { coords, error, reintentar: () => setSeq((s) => s + 1) };
}

/* ───────────────────────────────────────────────
   Checklist efectivo de un objetivo.
   Plantilla por tipo de servicio + las diferencias
   propias del objetivo (quitar o sumar ítems).
─────────────────────────────────────────────── */
function resolverChecklist(objetivo, defs, ajustes) {
  if (!objetivo) return [];
  const sub    = objetivo.subtipo || "barrio_unipersonal";
  const propios = new Map(
    (ajustes || [])
      .filter(a => String(a.objetivo_id) === String(objetivo.id))
      .map(a => [String(a.item_id), a])
  );

  return defs.filter(d => {
    const ajuste = propios.get(String(d.id));
    if (ajuste) return ajuste.incluido;              // el objetivo decide explícitamente
    return (d.tipos_objetivo || []).includes(sub);   // si no, manda la plantilla del tipo
  });
}

function Icon({ name, size = 20, className = "", strokeWidth = 2, fill = "none" }) {
  const d = ICON_PATHS[name];
  if (!d) return null;
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke="currentColor"
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      className={cx("shrink-0", className)} aria-hidden="true" focusable="false">
      {d.split("|").filter(Boolean).map((p, i) => <path key={i} d={p} />)}
    </svg>
  );
}

function Isotipo({ size = 28, className = "" }) {
  return (
    <svg viewBox="-1 0 701 902" width={size * 701 / 902} height={size} fill="none"
      className={className} role="img" aria-label="Argentina Seguridad Integral">
      <path fill="currentColor" d={ASI_ISOTIPO_D} />
    </svg>
  );
}

/* Lockup vertical: el jinete sobre el nombre, para la portada del login */
function Marca({ size = 64, className = "" }) {
  return (
    <div className={cx("flex flex-col items-center", className)}>
      <Isotipo size={size} />
      <p className="display text-center mt-4" style={{ fontSize: size * .30, lineHeight: 1.12 }}>
        Argentina<br />Seguridad<br />Integral
      </p>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PRIMITIVAS DEL LIBRO
   La hoja levanta del lecho reglado con sombra de offset real.
   Nada se infla; nada lleva halo de color sin desplazamiento.
   Los nombres .clay* se conservan: el marcado existente hereda
   el mundo nuevo sin reescribirse.
═══════════════════════════════════════════════════════════ */
function Clay({ children, className = "", inset = false, tint, as: Tag = "div", ...rest }) {
  return (
    <Tag className={cx(inset ? "clay-inset" : tint ? "clay-tint" : "clay", className)}
      style={tint ? { background: tint, ...(rest.style || {}) } : rest.style} {...rest}>
      {children}
    </Tag>
  );
}

/* Cada variante es una tinta plana con su canto impreso al pie:
   una tecla de máquina, no una burbuja. Sin degradados. */
const BTN_VARIANTS = {
  primary: "bg-foil text-ink border-b-[3px] border-foil-dim",
  aqua:    "bg-navy-700 text-paper-hi border-b-[3px] border-navy-900",
  success: "bg-good text-paper-hi border-b-[3px] border-good-ink",
  danger:  "bg-rubric text-paper-hi border-b-[3px] border-rubric-ink",
  warn:    "bg-warn text-paper-hi border-b-[3px] border-warn-ink",
  white:   "bg-paper-hi text-ink border border-paper-rule border-b-[3px] border-b-ink-soft",
  soft:    "bg-navy-100 text-navy-700 border-b-[3px] border-navy-200",
  ghost:   "bg-transparent text-ink-mute shadow-none border-b-2 border-transparent hover:border-ink-faint",
};

function Btn({ children, variant = "primary", size = "md", icon, iconRight, full, className = "", disabled, loading, ...rest }) {
  /* Alturas mínimas por PRODUCT.md: objetivo táctil ≥48px, una sola mano */
  const sizes = {
    sm: "px-4 min-h-[40px] text-[13px] gap-1.5",
    md: "px-5 min-h-[48px] text-[15px] gap-2",
    lg: "px-6 min-h-[56px] text-[17px] gap-2.5",
    xl: "px-6 min-h-[60px] text-[18px] gap-3",
  };
  const dis = disabled || loading;
  return (
    <button disabled={dis}
      className={cx(
        "clay-btn inline-flex items-center justify-center font-bold no-select uppercase",
        sizes[size], full && "w-full",
        dis ? "bg-paper-bed text-ink-faint border-b-[3px] border-paper-rule" : BTN_VARIANTS[variant],
        variant === "ghost" && "shadow-none",
        className
      )}
      style={{ letterSpacing: ".07em", fontVariationSettings: '"wdth" 96' }} {...rest}>
      {loading ? <Icon name="refresh" size={17} className="a-spin" /> : icon ? <Icon name={icon} size={17} /> : null}
      {children}
      {iconRight && !loading && <Icon name={iconRight} size={17} />}
    </button>
  );
}

/* Chapa de rótulo: cuadrada, con su filete del mismo tono */
const TONE_CHIP = {
  good:  "bg-good-soft   text-good-ink   border-good",
  warn:  "bg-warn-soft   text-warn-ink   border-warn",
  bad:   "bg-bad-soft    text-bad-ink    border-bad",
  brand: "bg-navy-100    text-navy-700   border-navy-200",
  aqua:  "bg-paper-bed   text-ink-soft   border-paper-rule",
  plum:  "bg-stamp-soft  text-stamp-ink  border-stamp",
  tang:  "bg-tang-soft   text-tang-ink   border-tang",
  gray:  "bg-paper-bed   text-ink-soft   border-paper-rule",
};

function Badge({ tone = "gray", children, icon, className = "" }) {
  return (
    <span className={cx("inline-flex items-center gap-1 border px-2 py-[3px] text-[11px] font-bold uppercase whitespace-nowrap", TONE_CHIP[tone] || TONE_CHIP.gray, className)}
      style={{ letterSpacing: ".08em", fontVariationSettings: '"wdth" 92' }}>
      {icon && <Icon name={icon} size={12} strokeWidth={2.6} />}
      {children}
    </span>
  );
}

function Dot({ tone = "good", pulse }) {
  const c = { good:"bg-good", warn:"bg-warn", bad:"bg-bad", brand:"bg-navy-700", gray:"bg-ink-faint" };
  return <span className={cx("w-2 h-2 shrink-0", c[tone], pulse && "a-pulse")} />;
}

/* ── Encabezado de sección: regla fuerte arriba, como el corte de un asiento ── */
function SH({ title, sub, right }) {
  return (
    <div className="flex items-end justify-between gap-3 mb-1 border-t-2 border-ink pt-2.5">
      <div>
        <h2 className="display text-[20px] text-ink">{title}</h2>
        {sub && <p className="text-[14px] text-ink-mute mt-1.5 leading-snug">{sub}</p>}
      </div>
      {right}
    </div>
  );
}

/* ── Rótulo de apparatus ── */
function Label({ children, className = "" }) {
  return <p className={cx("rotulo", className)}>{children}</p>;
}

/* ── Casilla de entrada: hundida en la hoja, con su regla al pie ── */
function Input({ label, icon, error, className = "", ...rest }) {
  return (
    <label className="block">
      {label && <Label className="mb-1.5">{label}</Label>}
      <div className={cx("clay-inset flex items-center gap-2.5 px-3 min-h-[48px]", error && "border-b-2 border-b-rubric")}>
        {icon && <Icon name={icon} size={18} className="text-ink-mute" />}
        <input className={cx("flex-1 bg-transparent outline-none text-[17px] font-medium text-ink placeholder:text-ink-faint min-w-0 py-2.5", className)} {...rest} />
      </div>
      {error && <p className="text-[13px] text-rubric-ink font-semibold mt-1.5 flex items-center gap-1"><Icon name="alert" size={13} />{error}</p>}
    </label>
  );
}

function Textarea({ label, hint, className = "", ...rest }) {
  return (
    <label className="block">
      {label && <Label className="mb-1.5">{label}</Label>}
      <div className="clay-inset px-3 py-2.5">
        <textarea className={cx("w-full bg-transparent outline-none text-[16px] font-medium text-ink placeholder:text-ink-faint resize-none leading-relaxed", className)} {...rest} />
      </div>
      {hint}
    </label>
  );
}

/* ── Cuadrante de progreso: trazo a tope, sin halo de color ── */
function Ring({ value, max, color = "#2D4175", size = 116, label }) {
  const r = 43, c = 2 * Math.PI * r;
  const pct = max > 0 ? Math.min(value / max, 1) : 0;
  return (
    <svg width={size} height={size} viewBox="0 0 110 110" className="shrink-0">
      <circle cx="55" cy="55" r={r} fill="none" stroke="#DDE0E4" strokeWidth="10" />
      <circle cx="55" cy="55" r={r} fill="none" stroke={color} strokeWidth="10" strokeLinecap="butt"
        strokeDasharray={c} strokeDashoffset={c - pct * c} transform="rotate(-90 55 55)"
        style={{ transition: "stroke-dashoffset .9s cubic-bezier(.2,.9,.3,1)" }} />
      <text x="55" y="53" textAnchor="middle" fill="#141E33" fontSize="25" fontWeight="800"
        fontFamily="Archivo" style={{ fontVariantNumeric:"tabular-nums" }}>{Math.round(pct * 100)}%</text>
      <text x="55" y="70" textAnchor="middle" fill="#546282" fontSize="11" fontWeight="700"
        fontFamily="Archivo" letterSpacing="1" style={{ fontVariantNumeric:"tabular-nums" }}>{label || `${value}/${max}`}</text>
    </svg>
  );
}

/* ── Barra: tinta plana sobre el lecho, sin brillo ── */
function Bar({ value, max, color = "#2D4175", height = 10 }) {
  const pct = max > 0 ? Math.min((value / max) * 100, 100) : 0;
  return (
    <div className="w-full overflow-hidden border border-paper-rule bg-paper-bed" style={{ height }}>
      <div className="h-full transition-[width] duration-700 ease-out" style={{ width: `${pct}%`, background: color }} />
    </div>
  );
}

/* ── Chapa identificatoria ── */
function Avatar({ nombre, size = 48, tone = "brand", src }) {
  const bg = { brand:"#2D4175", aqua:"#32405E", plum:"#4B3A7A", warn:"#8A5A12" }[tone];
  return (
    <div className="shrink-0 flex items-center justify-center font-bold text-paper-hi overflow-hidden border border-navy-900"
      style={{ width:size, height:size, background:bg, fontSize:size*.34,
               fontVariationSettings:'"wdth" 92', letterSpacing:".02em",
               boxShadow:"0 1px 0 rgba(20,30,51,.22)" }}>
      {src ? <img src={src} alt="" className="w-full h-full object-cover" /> : iniciales(nombre)}
    </div>
  );
}

/* ── Fases del asiento ────────────────────────────────────────
   No son puntitos: cada fase es una casilla numerada de ancho fijo,
   siempre rotulada. La cursada va en tinta plena, las asentadas
   llevan su marca, las pendientes quedan en hairline. */
function Stepper({ steps, current }) {
  return (
    <div className="flex items-stretch shrink-0 border-b border-paper-rule bg-paper" role="list">
      {steps.map((s, i) => {
        const hecho = i < current, activo = i === current;
        return (
          <div key={s} role="listitem" aria-current={activo ? "step" : undefined}
            className={cx("flex-1 min-w-0 flex flex-col items-center justify-center gap-0.5 py-2 px-1 border-r border-paper-rule last:border-r-0",
              activo ? "bg-navy-700 text-paper-hi" : hecho ? "bg-navy-100 text-navy-700" : "bg-paper text-ink-faint")}>
            <span className="folio text-[13px] leading-none flex items-center gap-1">
              {hecho ? <Icon name="check" size={12} strokeWidth={3} /> : String(i + 1).padStart(2, "0")}
            </span>
            <span className="text-[10px] font-bold uppercase truncate max-w-full leading-tight"
              style={{ letterSpacing:".06em", fontVariationSettings:'"wdth" 88' }}>{s}</span>
          </div>
        );
      })}
    </div>
  );
}

/* ── Pestañas: comparten el lecho, la activa va en tinta plena ── */
function Segmented({ options, value, onChange, tone = "brand" }) {
  const activeBg = { brand:"bg-navy-700", plum:"bg-stamp", aqua:"bg-ink-soft" }[tone];
  return (
    <div className="flex border border-paper-rule bg-paper-bed">
      {options.map(([k, label, count]) => (
        <button key={k} onClick={() => onChange(k)}
          className={cx("flex-1 min-h-[44px] px-2 text-[13px] font-bold uppercase transition-colors duration-150 border-r border-paper-rule last:border-r-0",
            value === k ? cx(activeBg, "text-paper-hi") : "text-ink-mute hover:text-ink")}
          style={{ letterSpacing:".07em", fontVariationSettings:'"wdth" 92' }}>
          {label}{count != null && <span className="ml-1 opacity-80 tnum">{count}</span>}
        </button>
      ))}
    </div>
  );
}

/* ── Hoja suelta que entra desde el pie ── */
function Sheet({ open, onClose, title, sub, children, maxH = "86%" }) {
  useEffect(() => {
    if (!open) return;
    const h = e => e.key === "Escape" && onClose();
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, [open, onClose]);

  if (!open) return null;
  return (
    <div className="absolute inset-0 z-50 flex items-end a-fade" style={{ background:"rgba(16,26,51,.52)" }}
      onClick={e => e.target === e.currentTarget && onClose()} role="dialog" aria-modal="true">
      <div className="w-full bg-paper a-sheet flex flex-col border-t-2 border-ink"
        style={{ maxHeight:maxH, boxShadow:"0 -8px 28px rgba(16,26,51,.34)" }}>
        <div className="flex items-start justify-between gap-3 px-5 pt-4 pb-3 shrink-0 border-b border-paper-rule">
          <div className="min-w-0">
            <h3 className="display text-[18px] text-ink">{title}</h3>
            {sub && <p className="text-[14px] text-ink-mute mt-1 leading-snug">{sub}</p>}
          </div>
          <button onClick={onClose} aria-label="Cerrar"
            className="w-11 h-11 flex items-center justify-center text-ink-soft border border-paper-rule bg-paper-hi clay-press shrink-0 focus-ring">
            <Icon name="x" size={19} />
          </button>
        </div>
        <div className="scroll-y px-5 pb-6 pt-4 flex-1">{children}</div>
      </div>
    </div>
  );
}

/* ── Renglón en blanco: el asiento que todavía no se hizo ── */
function Empty({ icon = "inbox", title, sub }) {
  return (
    <div className="flex flex-col items-center justify-center py-12 px-6 text-center gap-3">
      <div className="w-16 h-16 flex items-center justify-center text-ink-faint border border-paper-rule bg-paper-bed">
        <Icon name={icon} size={30} strokeWidth={1.8} />
      </div>
      <div>
        <p className="display text-[15px] text-ink">{title}</p>
        {sub && <p className="text-[14px] text-ink-mute mt-1.5 leading-relaxed max-w-[260px]">{sub}</p>}
      </div>
    </div>
  );
}

function Skeleton({ h = 78, className = "" }) {
  return <div className={cx("skeleton", className)} style={{ height: h }} />;
}

/* ── Renglón clave/valor: se apoya en el reglado ── */
function Row({ k, v, tone, last }) {
  return (
    <div className={cx("flex justify-between items-center gap-3 py-3", !last && "border-b border-paper-rule")}>
      <span className="text-[14px] text-ink-mute font-medium shrink-0">{k}</span>
      {tone
        ? <Badge tone={tone}>{v}</Badge>
        : <span className="text-[15px] font-bold text-ink text-right leading-snug tnum">{v}</span>}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   MARCA DE AGUA SOBRE FOTO (PRD §8 paso 5 · §10)
   Estampa fecha, hora, coordenadas y supervisor en el canvas.
═══════════════════════════════════════════════════════════ */
function estamparFoto(dataUrl, meta) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const maxW  = 1080;
      const scale = Math.min(1, maxW / img.width);
      const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      const ctx = cv.getContext("2d");
      ctx.drawImage(img, 0, 0, w, h);

      const barH = Math.max(70, Math.round(h * 0.16));
      const g = ctx.createLinearGradient(0, h - barH, 0, h);
      g.addColorStop(0, "rgba(2,6,23,0)");
      g.addColorStop(.4, "rgba(2,6,23,.72)");
      g.addColorStop(1, "rgba(2,6,23,.93)");
      ctx.fillStyle = g;
      ctx.fillRect(0, h - barH, w, barH);

      const pad = Math.round(w * .035);
      const fs  = Math.max(14, Math.round(h * .028));
      ctx.textBaseline = "alphabetic";
      ctx.fillStyle = "#F5F6F7";
      ctx.font = `800 ${fs}px Inter, system-ui, sans-serif`;
      ctx.fillText(meta.l1, pad, h - barH + fs * 1.7);
      ctx.fillStyle = "#C3CEE2";
      ctx.font = `600 ${Math.round(fs * .84)}px Inter, system-ui, sans-serif`;
      ctx.fillText(meta.l2, pad, h - barH + fs * 3.0);
      ctx.fillText(meta.l3, pad, h - barH + fs * 4.15);

      resolve(cv.toDataURL("image/jpeg", .82));
    };
    img.onerror = () => resolve(dataUrl);
    img.src = dataUrl;
  });
}

/* ═══════════════════════════════════════════════════════════
   CONTEXTO GLOBAL — única fuente de verdad de la app
   Funciona con datos semilla y, si hay API conectada,
   sustituye por los datos reales de PostgreSQL.
═══════════════════════════════════════════════════════════ */
const AppContext = createContext();

function AppProvider({ children }) {
  /* ── Estado operativo (modo demo / espejo local) ── */
  const [rondasGuardadas, setRondasGuardadas] = useState(SEED_RONDAS);
  const [ticketsActivos,  setTicketsActivos]  = useState(SEED_TICKETS);
  const [liveFeed,        setLiveFeed]        = useState(SEED_FEED);
  const [visitasPorObj,   setVisitasPorObj]   = useState(
    () => Object.fromEntries(SEED_OBJETIVOS.map(o => [o.id, o.visitas_mes]))
  );

  /* ── Conectividad y cola offline (PRD §10) ── */
  const [offline, setOffline] = useState(false);
  const [queue,   setQueue]   = useState([]);
  const [syncing, setSyncing] = useState(false);
  const [syncMsg, setSyncMsg] = useState(null);
  const [ticketSeq, setTicketSeq] = useState(42);

  /* ── Capa de API ── */
  const [apiUrl,      setApiUrl]      = useState("");
  const [apiStatus,   setApiStatus]   = useState("unconfigured"); // unconfigured|connecting|connected|error
  const [apiError,    setApiError]    = useState(null);
  const [currentUser, setCurrentUser] = useState(null);
  const [apiToken,    setApiToken]    = useState(null);

  /* ── Catálogos (semilla o API) ── */
  const [objetivos,     setObjetivos]     = useState(SEED_OBJETIVOS);
  const [vigiladores,   setVigiladores]   = useState(SEED_VIGILADORES);
  const [secciones,     setSecciones]     = useState(SEED_SECCIONES);
  const [checklistDefs, setChecklistDefs] = useState(SEED_CHECKLIST);
  const [ajustes,       setAjustes]       = useState(SEED_AJUSTES);
  const [observaciones, setObservaciones] = useState(SEED_OBSERVACIONES);

  const online = apiStatus === "connected" && !offline;

  const apiFetch = useCallback((path, opts = {}) => {
    const base = apiUrl.replace(/\/$/, "");
    return fetch(base + path, {
      ...opts,
      headers: {
        "Content-Type": "application/json",
        "bypass-tunnel-reminder": "true",
        ...(apiToken ? { Authorization: `Bearer ${apiToken}` } : {}),
        ...(opts.headers || {}),
      },
    });
  }, [apiUrl, apiToken]);

  /* ── Probar y fijar la URL del servidor ── */
  const conectarApi = async (url) => {
    const base = url.trim().replace(/\/$/, "");
    if (!base) return;
    setApiUrl(base); setApiStatus("connecting"); setApiError(null);
    try {
      const res  = await fetch(base + "/", { headers: { "bypass-tunnel-reminder":"true" } });
      const data = await res.json();
      if (data.ok) { setApiStatus("connected"); }
      else { setApiStatus("error"); setApiError("El servidor respondió con un estado inesperado."); }
    } catch (e) {
      setApiStatus("error");
      setApiError("No se pudo alcanzar el servidor. Verificá la URL.");
    }
  };

  const desconectarApi = () => {
    setApiStatus("unconfigured"); setApiUrl(""); setApiToken(null); setApiError(null);
    setObjetivos(SEED_OBJETIVOS); setVigiladores(SEED_VIGILADORES);
    setSecciones(SEED_SECCIONES); setChecklistDefs(SEED_CHECKLIST); setObservaciones(SEED_OBSERVACIONES);
  };

  /* ── Cargar catálogos reales tras el login ── */
  const cargarCatalogos = useCallback(async () => {
    try {
      const res  = await apiFetch("/api/inicializar");
      const data = await res.json();
      if (!data.ok) return;
      if (data.objetivos?.length)     { setObjetivos(data.objetivos); setVisitasPorObj(Object.fromEntries(data.objetivos.map(o => [o.id, o.visitas_mes || 0]))); }
      if (data.vigiladores?.length)   setVigiladores(data.vigiladores);
      if (data.secciones?.length)     setSecciones(data.secciones);
      if (data.checklist?.length)     setChecklistDefs(data.checklist.map(i => ({ ...i, seccion_clave: i.seccion_clave })));
      if (data.ajustes)               setAjustes(data.ajustes);
      if (data.observaciones?.length) setObservaciones(data.observaciones);
    } catch (e) { console.warn("[catalogos]", e.message); }
  }, [apiFetch]);

  // Los catálogos requieren token: se cargan recién cuando hay sesión iniciada
  useEffect(() => {
    if (apiStatus === "connected" && apiToken) cargarCatalogos();
  }, [apiStatus, apiToken]);

  /* ── KPIs calculados reactivamente sobre el estado local ── */
  const kpis = useMemo(() => {
    const metaTotal = objetivos.reduce((a, o) => a + (o.visitas_meta_mes || 0), 0);
    const hechas    = objetivos.reduce((a, o) => a + (visitasPorObj[o.id] || 0), 0);
    const porTipo = {};
    for (const o of objetivos) {
      const t = o.tipo || "Otros";
      porTipo[t] = porTipo[t] || { completadas: 0, total: 0 };
      porTipo[t].completadas += visitasPorObj[o.id] || 0;
      porTipo[t].total       += o.visitas_meta_mes || 0;
    }
    return {
      visitas:     hechas,
      metaVisitas: metaTotal || 1,
      criticas:    ticketsActivos.filter(t => t.val === "M" && t.estado === "Activo").length,
      activas:     ticketsActivos.filter(t => t.estado === "Activo").length,
      cerradas:    ticketsActivos.filter(t => t.estado === "Cerrado").length,
      porTipo,
      porObjetivo: objetivos.map(o => ({ ...o, realizadas: visitasPorObj[o.id] || 0 })),
    };
  }, [objetivos, visitasPorObj, ticketsActivos]);

  /* ── Commit atómico al estado local ── */
  const _commit = (payloads) => {
    setRondasGuardadas(r => [...payloads.map(p => p.ronda), ...r]);
    const tks = payloads.flatMap(p => p.tickets);
    if (tks.length) setTicketsActivos(t => [...tks, ...t]);
    setLiveFeed(f => [...payloads.map(p => p.feed), ...f].slice(0, 9));
    setVisitasPorObj(v => {
      const n = { ...v };
      for (const p of payloads) if (p.objetivoId != null) n[p.objetivoId] = (n[p.objetivoId] || 0) + 1;
      return n;
    });
  };

  /* ── Construir el payload de una ronda terminada ── */
  const construirActa = (rd, supervisorNombre) => {
    const now   = new Date();
    const stamp = fmtFecha(now) + " · " + fmtHora(now);
    const seq   = String(Date.now()).slice(-6);

    // Cada ítem R/M genera un ticket dirigido al área de la observación elegida
    let n = ticketSeq;
    const tickets = Object.entries(rd.respuestas || {})
      .filter(([, r]) => r.estado === "R" || r.estado === "M")
      .map(([itemId, r]) => {
        const def   = checklistDefs.find(d => String(d.id) === String(itemId)) || {};
        const obs   = r.obsPred?.[0] || r.obsLibre || def.titulo_corto || "Observación registrada";
        const catal = observaciones.find(o => o.texto === r.obsPred?.[0]);
        const area  = catal?.area || def.area_responsable || "Operaciones";
        n += 1;
        return {
          id:     `INC-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}-${String(n).padStart(4,"0")}`,
          _itemId: def.id, obj: rd.objetivo?.nombre || "—", sup: supervisorNombre,
          val: r.estado, area, estado: "Activo", desc: obs, item: def.titulo_corto,
          vig: rd.vigiladores?.[0]?.nombre || "—", fecha: stamp, isNew: true,
        };
      });

    // La negativa a firmar genera su propio ticket a RRHH (PRD §5.2)
    for (const v of rd.vigiladores || []) {
      const f = rd.firmas?.[v.id];
      if (f?.nego) {
        n += 1;
        tickets.push({
          id: `INC-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}-${String(n).padStart(4,"0")}`,
          obj: rd.objetivo?.nombre || "—", sup: supervisorNombre, val: "M", area: "RRHH", estado: "Activo",
          desc: `Negativa a firmar el acta — ${v.nombre} (legajo ${v.legajo})`,
          item: "Firma del acta", vig: v.nombre, fecha: stamp, isNew: true,
        });
      }
    }
    setTicketSeq(n);

    const codigo = `ACTA-${now.getFullYear()}${String(now.getMonth()+1).padStart(2,"0")}${String(now.getDate()).padStart(2,"0")}-${seq}`;
    const ronda = {
      id: codigo, supervisor: supervisorNombre, objetivo: rd.objetivo?.nombre || "—",
      tipo: rd.tipo || "presencial", gpsStatus: rd.gpsStatus, fecha: now,
      tickets: tickets.map(t => t.id),
    };
    const partes = supervisorNombre.split(" ");
    const feed = {
      hora: fmtHora(now),
      sup:  (partes[0][0] || "") + ". " + partes[partes.length - 1],
      obj:  cortar(rd.objetivo?.nombre || "Objetivo", 20),
      tipo: rd.tipo === "remota" ? "Remota" : "Presencial",
      ok:   tickets.length === 0, isNew: true,
    };

    return { ronda, tickets, feed, codigo, objetivoId: rd.objetivo?.id, generadaEn: now };
  };

  /* ── Enviar el acta al backend real ── */
  const enviarActaApi = useCallback(async (rd, acta) => {
    const objId = rd.objetivo?.id;
    if (!objId) return;
    const body = {
      objetivo_id: objId,
      tipo: rd.tipo || "presencial",
      en_geocerca: rd.gpsStatus === "inside",
      lat: rd.deviceCoords?.lat ?? null, lng: rd.deviceCoords?.lng ?? null,
      justificacion_fuera: rd.justificacion || null,
      sincronizado_offline: Boolean(rd._offline),
      hora_inicio: rd.horaInicio ? new Date(rd.horaInicio).toISOString() : null,
      hora_fin:    new Date().toISOString(),
      vigiladores: (rd.vigiladores || []).map(v => ({
        id: v.id,
        firma_base64: rd.firmas?.[v.id]?.dataUrl || null,
        nego_firmar:  Boolean(rd.firmas?.[v.id]?.nego),
      })),
      checklist: Object.entries(rd.respuestas || {}).map(([itemId, r]) => {
        const def = checklistDefs.find(d => String(d.id) === String(itemId)) || {};
        return {
          item_id: def.id, pregunta: def.titulo_corto, valoracion: r.estado,
          observacion_pred: (r.obsPred || []).join(" · ") || null,
          observacion_libre: r.obsLibre || null,
        };
      }),
      incidencias: acta.tickets.map(t => ({
        item_id: t._itemId, item_titulo: t.item, valoracion: t.val,
        area_responsable: t.area, categoria: t.area, descripcion: t.desc,
        vigilador_id: (rd.vigiladores || [])[0]?.id,
      })),
      evidencias: (rd.fotos || []).map(f => ({ imagen_base64: f.dataUrl, lat: f.lat, lng: f.lng })),
    };
    const res  = await apiFetch("/api/rondas", { method:"POST", body: JSON.stringify(body) });
    const data = await res.json();
    if (!data.ok) throw new Error(data.mensaje || "El servidor rechazó el acta.");
    return data;
  }, [apiFetch, checklistDefs]);

  /* ── Guardar ronda: commit inmediato o cola FIFO offline ── */
  const guardarRonda = async (rd, supervisorNombre) => {
    const acta = construirActa(rd, supervisorNombre);

    if (offline) {
      setQueue(q => [...q, { acta, rd: { ...rd, _offline: true } }]);
      return { estado: "encolada", acta };
    }

    _commit([acta]);

    if (apiStatus === "connected" && currentUser?.rol === "supervisor") {
      try {
        const r = await enviarActaApi(rd, acta);
        return { estado: "guardada", acta: { ...acta, codigo: r.codigo_acta || acta.codigo }, servidor: true };
      } catch (e) {
        return { estado: "guardada", acta, servidor: false, aviso: e.message };
      }
    }
    return { estado: "guardada", acta, servidor: false };
  };

  /* ── Sincronizar la cola pendiente ── */
  const queueRef = useRef(queue);
  useEffect(() => { queueRef.current = queue; }, [queue]);

  const sincronizar = useCallback(async () => {
    const pend = queueRef.current;
    if (!pend.length || syncing) return;
    setSyncing(true); setSyncMsg(null);

    await new Promise(r => setTimeout(r, 1400)); // latencia simulada de red
    _commit(pend.map(p => p.acta));

    if (apiStatus === "connected" && currentUser?.rol === "supervisor") {
      for (const p of pend) { try { await enviarActaApi(p.rd, p.acta); } catch (e) { console.warn("[sync]", e.message); } }
    }

    setQueue([]); setSyncing(false);
    const n = pend.length;
    setSyncMsg({ tone:"good", text:`${n} acta${n > 1 ? "s" : ""} sincronizada${n > 1 ? "s" : ""} con el servidor.` });
    setTimeout(() => setSyncMsg(null), 5200);
  }, [apiStatus, currentUser, enviarActaApi, syncing]);

  /* Reintento automático cada 60s mientras haya cola y conexión (PRD §10) */
  useEffect(() => {
    if (offline || queue.length === 0) return;
    const t = setInterval(() => { sincronizar(); }, 60000);
    return () => clearInterval(t);
  }, [offline, queue.length, sincronizar]);

  const alternarConexion = () => {
    if (offline) { setOffline(false); setTimeout(() => sincronizar(), 300); }
    else { setOffline(true); setSyncMsg(null); }
  };

  /* ── Cerrar ticket (Admin) ── */
  const cerrarTicket = (id, resolucion) => {
    setTicketsActivos(t => t.map(tk => tk.id === id ? { ...tk, estado:"Cerrado", resolucion, isNew:false } : tk));
  };

  const cerrarSesion = () => { setCurrentUser(null); setApiToken(null); };

  return (
    <AppContext.Provider value={{
      rondasGuardadas, ticketsActivos, liveFeed, kpis, visitasPorObj,
      offline, queue, syncing, syncMsg, online,
      guardarRonda, alternarConexion, sincronizar, cerrarTicket, cerrarSesion,
      apiUrl, apiStatus, apiError, apiFetch, conectarApi, desconectarApi, cargarCatalogos,
      currentUser, setCurrentUser, apiToken, setApiToken,
      objetivos, vigiladores, secciones, checklistDefs, ajustes, observaciones,
    }}>
      {children}
    </AppContext.Provider>
  );
}

const useApp = () => useContext(AppContext);

function SyncToast() {
  const { syncMsg, syncing, offline, queue } = useApp();
  let text = null, tone = "brand", icon = "cloud";

  if (syncing)            { text = `Procesando ${queue.length} acta${queue.length !== 1 ? "s" : ""} en cola…`; tone = "brand"; icon = "refresh"; }
  else if (syncMsg)       { text = syncMsg.text; tone = syncMsg.tone; icon = "check-circle"; }
  else if (offline && queue.length) { text = `${queue.length} acta${queue.length > 1 ? "s" : ""} en cola local · se enviará al recuperar señal`; tone = "warn"; icon = "cloud-off"; }

  if (!text) return null;
  const bg = { brand:"bg-brand-100 text-brand-800", good:"bg-good-soft text-good-ink", warn:"bg-warn-soft text-warn-ink" }[tone];
  return (
    <div className={cx("mx-4 mb-1 rounded-[16px] px-3.5 py-2.5 flex items-center gap-2 a-dn shrink-0", bg)}>
      <Icon name={icon} size={15} className={syncing ? "a-spin" : ""} />
      <span className="text-[11px] font-bold leading-snug">{text}</span>
    </div>
  );
}

            checklist se leen de PostgreSQL.
          </p>
        </Clay>
      )}
    </div>
  );
}

  supervisor: { username:"supervisor", password:"supervisor123", nombre:"María González",  rol:"supervisor" },
  admin:      { username:"admin",      password:"admin123",      nombre:"Roberto Valente", rol:"admin" },
