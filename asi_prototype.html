function LoginScreen() {
  const { apiStatus, apiFetch, setCurrentUser, setApiToken } = useApp();
  const [user, setUser]   = useState("");
  const [pass, setPass]   = useState("");
  const [ver,  setVer]    = useState(false);
  const [load, setLoad]   = useState(false);
  const [err,  setErr]    = useState(null);

  const entrar = async () => {
    setErr(null);
    if (!user.trim() || !pass) { setErr("Ingresá usuario y contraseña."); return; }
    setLoad(true);

    if (apiStatus === "connected") {
      try {
        const res  = await apiFetch("/api/login", { method:"POST", body: JSON.stringify({ username:user.trim(), password:pass }) });
        const data = await res.json();
        if (data.ok) { setApiToken(data.token); setCurrentUser(data.usuario); }
        else setErr(data.mensaje || "Credenciales incorrectas.");
      } catch { setErr("No se pudo contactar al servidor."); }
      finally { setLoad(false); }
      return;
    }

    // Modo demo: valida contra las credenciales locales
    await new Promise(r => setTimeout(r, 480));
    const match = Object.values(DEMO_CRED).find(c => c.username === user.trim().toLowerCase() && c.password === pass);
    if (match) setCurrentUser({ id: 0, nombre: match.nombre, rol: match.rol });
    else setErr("Usuario o contraseña incorrectos.");
    setLoad(false);
  };

  return (
    <div className="scroll-y a-fade lecho">
      {/* ── La tapa: tela navy estampada en lámina dorada ── */}
      <div className="tela px-6 pt-9 pb-8 border-b-2 border-navy-900 relative">
        <div className="text-foil a-pop"><Isotipo size={62} /></div>
        <h1 className="display text-[27px] text-paper-hi mt-5 leading-[1.06]">
          Argentina<br />Seguridad<br />Integral
        </h1>
        <p className="rotulo text-foil mt-3">Sociedad Anónima · ASISA</p>
        {/* Estampado al pie de la tapa, como el rótulo del lomo */}
        <p className="rotulo text-navy-400 absolute bottom-3 right-6">Libro de novedades</p>
      </div>

      {/* ── El primer folio ── */}
      <div className="px-5 pt-6 pb-7">
      <Clay className="p-5 a-up filete">
        <SH title="Iniciar sesión" sub="Acceso individual por supervisor" />
        <div className="flex flex-col gap-3.5 mt-4">
          <Input label="Usuario" icon="user" value={user} autoCapitalize="none" spellCheck="false"
            onChange={e => setUser(e.target.value)} placeholder="tu.usuario" />
          <div>
            <Label className="mb-1.5">Contraseña</Label>
            <div className="clay-inset flex items-center gap-2.5 px-3 min-h-[48px]">
              <Icon name="lock" size={18} className="text-ink-mute" />
              <input type={ver ? "text" : "password"} value={pass} onChange={e => setPass(e.target.value)}
                onKeyDown={e => e.key === "Enter" && entrar()} placeholder="••••••••"
                className="flex-1 bg-transparent outline-none text-[17px] font-medium text-ink placeholder:text-ink-faint min-w-0 py-2.5" />
              <button onClick={() => setVer(v => !v)} className="text-ink-mute p-2 focus-ring"
                aria-label={ver ? "Ocultar contraseña" : "Mostrar contraseña"}>
                <Icon name={ver ? "eye-off" : "eye"} size={18} />
              </button>
            </div>
          </div>

          {err && (
            <div className="bg-bad-soft filete px-3.5 py-2.5 flex items-start gap-2 a-dn">
              <Icon name="alert" size={16} className="text-bad-ink mt-px shrink-0" />
              <p className="text-[14px] font-bold text-bad-ink leading-snug">{err}</p>
            </div>
          )}

          <Btn full size="lg" onClick={entrar} loading={load} iconRight={load ? null : "arrow-r"}>
            {load ? "Verificando…" : "Ingresar"}
          </Btn>

          <div className="flex items-center gap-3 my-0.5">
            <span className="h-px bg-paper-rule flex-1" />
            <span className="rotulo">o</span>
            <span className="h-px bg-paper-rule flex-1" />
          </div>

          <Btn full size="md" variant="white" disabled icon="cloud"
            title="Disponible en la versión corporativa">
            OneDrive corporativo
          </Btn>
        </div>
      </Clay>

      {/* Accesos de prueba */}
      <Clay className="p-4 mt-4 a-up" style={{ animationDelay:"90ms" }}>
        <Label className="mb-2.5">Accesos de prueba</Label>
        <div className="flex flex-col gap-2">
          {Object.entries(DEMO_CRED).map(([k, c]) => (
            <button key={k} onClick={() => { setUser(c.username); setPass(c.password); setErr(null); }}
              className="clay-inset clay-press flex items-center gap-3 px-3 min-h-[52px] py-2 text-left focus-ring w-full">
              <Icon name={k === "supervisor" ? "shield" : k === "admin" ? "clipboard" : "chart"} size={18} className="text-navy-700 shrink-0" />
              <div className="flex-1 min-w-0">
                <p className="text-[15px] font-bold text-ink leading-tight">{c.nombre}</p>
                <p className="text-[13px] text-ink-mute tnum leading-tight mt-0.5">{c.username} · {c.password}</p>
              </div>
              <Icon name="chevron-r" size={16} className="text-ink-mute shrink-0" />
            </button>
          ))}
        </div>
      </Clay>

      <p className="rotulo text-center mt-6">ASISA · Panel de Supervisión v3.0</p>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PASO 1 — Inicio de ronda: objetivo + geocerca (PRD §2)
═══════════════════════════════════════════════════════════ */
const TIPO_ICON = { Barrios:"home", Industrias:"factory", Locales:"store" };

function Step1({ rd, setRD, onNext }) {
  const { objetivos, visitasPorObj } = useApp();
  const { coords, error: gpsErr, reintentar } = useDeviceGeolocation();
  const [just, setJust] = useState(rd.justificacion || "");
  const [busca,setBusca]= useState("");
  const [tick, setTick] = useState(new Date());
  const obj = rd.objetivo;

  useEffect(() => { const t = setInterval(() => setTick(new Date()), 1000); return () => clearInterval(t); }, []);

  // Distancia real al objetivo — deriva el estado del geocerco a partir del GPS del dispositivo, no de un valor simulado
  const distancia = (coords && obj?.lat != null) ? distanciaMetros(coords.lat, coords.lng, obj.lat, obj.lng) : null;
  const gps = gpsErr ? "error" : !coords ? "searching" : !obj ? "searching" : (distancia <= obj.radio_geocerca_m ? "inside" : "outside");

  useEffect(() => {
    if (!coords) return;
    setRD(p => ({ ...p, deviceCoords: coords, gpsStatus: gps, distanciaGeocerca: distancia != null ? Math.round(distancia) : null }));
  }, [coords, gps, distancia]);

  const lista = useMemo(() => {
    const q = busca.trim().toLowerCase();
    return objetivos.filter(o => !q || o.nombre.toLowerCase().includes(q) || (o.direccion || "").toLowerCase().includes(q));
  }, [objetivos, busca]);

  const grupos = useMemo(() => {
    const g = {};
    for (const o of lista) (g[o.tipo] = g[o.tipo] || []).push(o);
    return g;
  }, [lista]);

  const elegir = (o) => setRD(p => ({ ...p, objetivo: o }));

  const puedePresencial = gps === "inside"  && obj;
  const puedeRemota     = (gps === "outside" || gps === "error") && obj && just.trim().length >= 10;

  const arrancar = (tipo) => {
    setRD(p => ({ ...p, tipo, justificacion: tipo === "remota" ? just : null, horaInicio: new Date() }));
    onNext();
  };

  const GPS_ERR_TXT = {
    denied:      "Permiso de ubicación denegado",
    unavailable: "Señal GPS no disponible",
    timeout:     "Tiempo de espera agotado",
    unsupported: "Este dispositivo no soporta GPS",
  };

  const GPS_UI = {
    searching: { tone:"warn", txt:"Buscando señal GPS…",     icon:"pin" },
    inside:    { tone:"good", txt:"Dentro del geocerco",     icon:"shield-ok" },
    outside:   { tone:"bad",  txt:"Fuera del geocerco",      icon:"alert" },
    error:     { tone:"bad",  txt: GPS_ERR_TXT[gpsErr] || "Error de GPS", icon:"alert" },
  }[gps];

  return (
    <div className="flex flex-col gap-4 px-4 py-4 a-fade">
      <SH title="Inicio de ronda" sub="Elegí el objetivo y validá tu presencia en el lugar" />

      {/* Reloj + estado GPS */}
      <Clay className="p-4">
        <div className="flex items-start justify-between gap-3">
          <div>
            <Label>Hora del dispositivo</Label>
            <p className="folio text-[38px] text-ink leading-none mt-1.5">{tick.toLocaleTimeString("es-AR")}</p>
            <p className="text-[15px] text-ink-mute mt-1.5 first-letter:uppercase">{fmtLargo(tick)}</p>
          </div>
        </div>
        <div className="clay-inset flex items-center gap-2.5 px-3.5 py-2.5 mt-3.5">
          <Dot tone={GPS_UI.tone} pulse={gps === "searching"} />
          <Icon name={GPS_UI.icon} size={17} className={cx("shrink-0",
            gps === "inside" ? "text-good-ink" : (gps === "outside" || gps === "error") ? "text-bad-ink" : "text-warn-ink")} />
          <span className={cx("text-[15px] font-bold",
            gps === "inside" ? "text-good-ink" : (gps === "outside" || gps === "error") ? "text-bad-ink" : "text-warn-ink")}>{GPS_UI.txt}</span>
          {obj && distancia != null && <span className="text-[14px] text-ink-mute ml-auto tnum shrink-0">{Math.round(distancia)} m · radio {obj.radio_geocerca_m} m</span>}
        </div>
        {coords && (
          <p className="text-[14px] text-ink-mute mt-2 tnum">
            {coords.lat.toFixed(5)}, {coords.lng.toFixed(5)} · precisión ±{Math.round(coords.accuracy)} m
          </p>
        )}
        {gps === "error" && (
          <button onClick={reintentar} className="clay-btn w-full mt-3 min-h-[48px] text-[15px] font-bold uppercase flex items-center justify-center gap-2 bg-paper-hi text-ink border border-paper-rule border-b-[3px] border-b-ink-soft" style={{ letterSpacing:".07em" }}>
            <Icon name="refresh" size={16} /> Reintentar ubicación
          </button>
        )}
      </Clay>

      {/* Selector de objetivo */}
      <div>
        <div className="flex items-center justify-between mb-2">
          <Label>Objetivo de la ronda</Label>
          {obj && <Badge tone="brand" icon="check">Seleccionado</Badge>}
        </div>
        <div className="clay-inset flex items-center gap-2.5 px-3.5 py-2.5 mb-2.5">
          <Icon name="search" size={16} className="text-ink-faint" />
          <input value={busca} onChange={e => setBusca(e.target.value)} placeholder="Buscar objetivo o dirección…"
            className="flex-1 bg-transparent outline-none text-[16px] font-medium text-ink placeholder:text-ink-faint min-w-0 py-2" />
          {busca && <button onClick={() => setBusca("")} className="text-ink-faint p-0.5" aria-label="Limpiar"><Icon name="x" size={15} /></button>}
        </div>

        {lista.length === 0 && <Empty icon="search" title="Sin resultados" sub="Probá con otro nombre o dirección." />}

        <div className="flex flex-col gap-3">
          {Object.entries(grupos).map(([tipo, arr]) => (
            <div key={tipo}>
              <div className="flex items-center gap-1.5 mb-1.5 px-1">
                <Icon name={TIPO_ICON[tipo] || "building"} size={13} className="text-ink-faint" />
                <span className="rotulo">{tipo}</span>
              </div>
              <div className="flex flex-col gap-2">
                {arr.map(o => {
                  const hechas = visitasPorObj[o.id] ?? o.visitas_mes ?? 0;
                  const meta   = o.visitas_meta_mes || 0;
                  const sel    = obj?.id === o.id;
                  const cumple = meta > 0 && hechas >= meta;
                  return (
                    <button key={o.id} onClick={() => elegir(o)}
                      className={cx("clay-press text-left p-3.5 rounded-[20px] transition-all duration-200 focus-ring",
                        sel ? "bg-gradient-to-br from-brand-500 to-brand-700 text-paper-hi shadow-lg" : "clay")}>
                      <div className="flex items-start justify-between gap-2">
                        <div className="min-w-0 flex-1">
                          <p className={cx("text-sm font-black leading-tight", sel ? "text-paper-hi" : "text-ink")}>{o.nombre}</p>
                          <p className={cx("text-[10px] mt-0.5 truncate", sel ? "text-brand-100" : "text-ink-faint")}>
                            {SUBTIPO_LABEL[o.subtipo] || o.tipo}{o.direccion ? ` · ${o.direccion}` : ""}
                          </p>
                        </div>
                        {sel
                          ? <span className="w-6 h-6 rounded-full bg-paper-hi/25 flex items-center justify-center shrink-0"><Icon name="check" size={14} strokeWidth={3} /></span>
                          : <span className={cx("text-[10px] font-black tnum px-2 py-1 rounded-full shrink-0", cumple ? "bg-good-soft text-good-ink" : "bg-brand-50 text-brand-700")}>{hechas}/{meta}</span>}
                      </div>
                      {/* Cumplimiento mensual del objetivo (PRD §7) */}
                      <div className="mt-2.5">
                        <div className={cx("w-full rounded-full overflow-hidden", sel ? "bg-paper-hi/25" : "bg-paper-bed")} style={{ height:6 }}>
                          <div className="h-full rounded-full transition-all duration-700"
                            style={{ width:`${meta ? Math.min(hechas / meta * 100, 100) : 0}%`,
                                     background: sel ? "#F5F6F7" : cumple ? "#1F6B4A" : "#2D4175" }} />
                        </div>
                        <p className={cx("text-[10px] mt-1 font-semibold", sel ? "text-brand-100" : "text-ink-faint")}>
                          {hechas} de {meta} visitas este mes
                        </p>
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          ))}
        </div>
      </div>

      {!obj && gps !== "searching" && (
        <div className="bg-warn-soft rounded-[16px] px-4 py-3 flex items-center gap-2 a-up">
          <Icon name="info" size={15} className="text-warn-ink" />
          <p className="text-xs font-bold text-warn-ink">Seleccioná un objetivo para continuar.</p>
        </div>
      )}

      {gps === "inside" && (
        <Btn full size="xl" variant="success" icon="shield-ok" disabled={!puedePresencial}
          onClick={() => arrancar("presencial")}>
          Iniciar checklist presencial
        </Btn>
      )}

      {(gps === "outside" || gps === "error") && (
        <div className="flex flex-col gap-3 a-up">
          <Clay className="p-4" tint="linear-gradient(135deg,#F1DFDF,#F1DFDF)">
            <div className="flex items-start gap-2.5">
              <Icon name="alert" size={18} className="text-bad-ink mt-px" />
              <div>
                <p className="text-sm font-black text-bad-ink">Modo presencial bloqueado</p>
                <p className="text-xs text-bad-ink/80 mt-1 leading-relaxed">
                  {gps === "error"
                    ? "No se pudo obtener tu ubicación real. Podés registrar una supervisión remota justificando el motivo."
                    : "Estás fuera del geocerco. Podés registrar una supervisión remota justificando el motivo."}
                </p>
              </div>
            </div>
          </Clay>
          <Textarea label="Justificación obligatoria" value={just} onChange={e => setJust(e.target.value)}
            rows={3} placeholder="Ej: Superviso por cámara desde la central a pedido del cliente…"
            hint={<p className={cx("text-[11px] font-bold mt-1.5", just.trim().length >= 10 ? "text-good-ink" : "text-ink-faint")}>
              {just.trim().length >= 10 ? `${just.trim().length} caracteres` : `Faltan ${10 - just.trim().length} caracteres`}
            </p>} />
          <Btn full size="xl" variant="warn" icon="radio" disabled={!puedeRemota} onClick={() => arrancar("remota")}>
            Iniciar supervisión remota
          </Btn>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PERFIL DEL VIGILADOR — 4 pestañas (PRD §9)
═══════════════════════════════════════════════════════════ */
const ESTADO_TONE = { activo:"good", suspendido:"bad", "baja temporal":"warn", baja:"warn" };

function PerfilVigilador({ v, historial = [], sanciones = [], incidencias = [] }) {
  const [tab, setTab] = useState("principal");
  const dCred = diasHasta(v.credencial_venc);
  const dLic  = diasHasta(v.licencia_venc);

  const alertas = [];
  if (dCred != null && dCred <= 30) alertas.push({ txt:`La credencial vence en ${dCred} días`, tone:"bad" });
  if (v.es_chofer && dLic != null && dLic <= 30) alertas.push({ txt:`El carnet de conducir vence en ${dLic} días`, tone:"warn" });

  return (
    <div className="flex flex-col gap-3.5">
      {/* Cabecera */}
      <div className="flex items-center gap-3.5">
        <Avatar nombre={v.nombre} size={60} src={v.foto_url} />
        <div className="min-w-0 flex-1">
          <p className="text-[15px] font-black text-ink leading-tight">{v.nombre}</p>
          <p className="text-xs text-ink-mute mt-0.5">{v.puesto}</p>
          <div className="flex gap-1.5 mt-1.5 flex-wrap">
            <Badge tone="brand">Legajo {v.legajo}</Badge>
            <Badge tone={ESTADO_TONE[v.estado] || "gray"} icon={v.estado === "activo" ? "check" : "alert"}>
              {v.estado?.charAt(0).toUpperCase() + v.estado?.slice(1)}
            </Badge>
          </div>
        </div>
      </div>

      {alertas.map((a, i) => (
        <div key={i} className={cx("rounded-[15px] px-3.5 py-2.5 flex items-start gap-2",
          a.tone === "bad" ? "bg-bad-soft" : "bg-warn-soft")}>
          <Icon name="alert" size={15} className={a.tone === "bad" ? "text-bad-ink" : "text-warn-ink"} />
          <p className={cx("text-[11px] font-bold leading-snug", a.tone === "bad" ? "text-bad-ink" : "text-warn-ink")}>
            {a.txt} · se notifica a RRHH automáticamente
          </p>
        </div>
      ))}

      <Segmented value={tab} onChange={setTab} options={[
        ["principal","Principales"], ["personal","Personales"], ["caract","Caract."], ["actas","Actas"],
      ]} />

      <Clay className="p-4 a-fade">
        {tab === "principal" && (
          <div>
            <Row k="Nombre completo"   v={v.nombre} />
            <Row k="Nº de legajo"      v={v.legajo} />
            <Row k="DNI"               v={v.dni || "—"} />
            <Row k="Estado"            v={v.estado} tone={ESTADO_TONE[v.estado] || "gray"} />
            <Row k="Objetivo asignado" v={v.objetivo_asignado || "Sin asignar"} last />
          </div>
        )}

        {tab === "personal" && (
          <div>
            <Row k="Teléfono"          v={v.telefono || "—"} />
            <Row k="Domicilio"         v={v.domicilio || "—"} />
            <Row k="Fecha de nac."     v={v.fecha_nacimiento ? fmtFecha(v.fecha_nacimiento) : "—"} />
            <Row k="Nacionalidad"      v={v.nacionalidad || "—"} last />
          </div>
        )}

        {tab === "caract" && (
          <div>
            <Row k="Nº credencial"     v={v.credencial_numero || "—"} />
            <Row k="Venc. credencial"
                 v={v.credencial_venc ? `${fmtFecha(v.credencial_venc)}${dCred != null ? ` · ${dCred}d` : ""}` : "—"}
                 tone={dCred != null && dCred <= 30 ? "bad" : "good"} />
            <Row k="Habilitado chofer" v={v.es_chofer ? "Sí" : "No"} tone={v.es_chofer ? "good" : "gray"} />
            {v.es_chofer && <Row k="Categoría licencia" v={v.licencia_cat || "—"} tone="brand" />}
            {v.es_chofer && <Row k="Venc. licencia"
                 v={v.licencia_venc ? `${fmtFecha(v.licencia_venc)}${dLic != null ? ` · ${dLic}d` : ""}` : "—"}
                 tone={dLic != null && dLic <= 30 ? "warn" : "good"} />}
            <Row k="Portación de arma" v={v.armado ? "Sí" : "No"} tone={v.armado ? "tang" : "gray"} />
            <Row k="Tiene radio"       v={v.tiene_radio ? "Sí" : "No"} tone={v.tiene_radio ? "good" : "gray"} />
            <Row k="Convenio"          v={v.convenio || "UPSRA"} tone="plum" last />
          </div>
        )}

        {tab === "actas" && (
          <div className="flex flex-col gap-4">
            <div>
              <Label className="mb-2">Sanciones registradas</Label>
              {sanciones.length === 0
                ? <p className="text-xs text-ink-faint py-1">Sin sanciones registradas.</p>
                : sanciones.map((s, i) => (
                  <div key={i} className={cx("flex items-start gap-2.5 py-2.5", i < sanciones.length - 1 && "border-b border-paper-rule")}>
                    <Badge tone={{ activa:"bad", cumplida:"good", apelada:"warn" }[s.estado] || "gray"}>{s.estado}</Badge>
                    <div className="min-w-0">
                      <p className="text-[12px] text-ink font-semibold leading-snug">{s.descripcion}</p>
                      <p className="text-[10px] text-ink-faint mt-0.5">{fmtFecha(s.fecha)}</p>
                    </div>
                  </div>
                ))}
            </div>

            <div>
              <Label className="mb-2">Historial de actas</Label>
              {historial.length === 0
                ? <p className="text-xs text-ink-faint py-1">Sin actas previas.</p>
                : historial.map((h, i) => (
                  <div key={i} className={cx("flex items-start gap-2.5 py-2.5", i < historial.length - 1 && "border-b border-paper-rule")}>
                    <Badge tone={h.tipo === "Sanción" ? "bad" : "warn"}>{h.tipo}</Badge>
                    <div className="min-w-0">
                      <p className="text-[12px] text-ink font-semibold leading-snug">{h.descripcion || h.desc}</p>
                      <p className="text-[10px] text-ink-faint mt-0.5">{fmtFecha(h.fecha)}</p>
                    </div>
                  </div>
                ))}
            </div>

            {incidencias.length > 0 && (
              <div>
                <Label className="mb-2">Incidencias asociadas</Label>
                {incidencias.map((t, i) => (
                  <div key={i} className={cx("py-2.5", i < incidencias.length - 1 && "border-b border-paper-rule")}>
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-mono font-bold text-ink-mute">{t.codigo_ticket}</span>
                      <Badge tone={t.estado === "ABIERTO" ? "bad" : "good"}>{t.estado}</Badge>
                    </div>
                    <p className="text-[12px] text-ink font-semibold leading-snug mt-1">{t.descripcion}</p>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}
      </Clay>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PASO 2 — Vigiladores a inspeccionar (múltiples · PRD §2.1)
═══════════════════════════════════════════════════════════ */
function Step2({ rd, setRD, onNext, onBack }) {
  const { vigiladores, apiStatus, apiFetch } = useApp();
  const [legajo, setLegajo] = useState("");
  const [error,  setError]  = useState(null);
  const [busy,   setBusy]   = useState(false);
  const [perfil, setPerfil] = useState(null);
  const sel = rd.vigiladores || [];

  const agregar = async () => {
    setError(null);
    const n = legajo.trim();
    if (!n) return;
    if (sel.some(v => String(v.legajo) === n)) { setError("Ese vigilador ya está en la lista."); setLegajo(""); return; }

    setBusy(true);
    let encontrado = vigiladores.find(v => String(v.legajo) === n);

    // Con API conectada trae el perfil completo (sanciones, historial, incidencias)
    if (apiStatus === "connected") {
      try {
        const res  = await apiFetch(`/api/vigilador/${n}`);
        const data = await res.json();
        if (data.ok) encontrado = { ...data.vigilador, _historial: data.historial, _sanciones: data.sanciones, _incidencias: data.incidencias };
      } catch { /* cae al catálogo local */ }
    }
    setBusy(false);

    if (!encontrado) { setError(`No se encontró el legajo ${n}.`); return; }
    setRD(p => ({ ...p, vigiladores: [...(p.vigiladores || []), encontrado] }));
    setLegajo("");
  };

  const quitar = (id) => setRD(p => ({
    ...p,
    vigiladores: (p.vigiladores || []).filter(v => v.id !== id),
    firmas: Object.fromEntries(Object.entries(p.firmas || {}).filter(([k]) => String(k) !== String(id))),
  }));

  const datosPerfil = (v) => ({
    historial:   v._historial   || SEED_HISTORIAL[v.legajo] || [],
    sanciones:   v._sanciones   || SEED_SANCIONES[v.legajo] || [],
    incidencias: v._incidencias || [],
  });

  return (
    <div className="flex flex-col gap-4 px-4 py-4 a-fade">
      <SH title="Vigiladores" sub={`Cargá el legajo de cada persona a inspeccionar en ${cortar(rd.objetivo?.nombre || "el objetivo", 26)}`} />

      <Clay className="p-4">
        <Label className="mb-2">Número de legajo</Label>
        <div className="flex gap-2">
          <div className="clay-inset flex items-center gap-2.5 px-3.5 py-3 flex-1 min-w-0">
            <Icon name="badge" size={17} className="text-ink-faint" />
            <input type="number" inputMode="numeric" value={legajo}
              onChange={e => { setLegajo(e.target.value); setError(null); }}
              onKeyDown={e => e.key === "Enter" && agregar()} placeholder="1024"
              className="flex-1 bg-transparent outline-none text-xl font-black text-ink tnum placeholder:text-ink-faint placeholder:font-semibold min-w-0" />
          </div>
          <Btn onClick={agregar} loading={busy} icon="user-plus" className="px-4">Sumar</Btn>
        </div>
        {error && <p className="text-[11px] text-bad-ink font-bold mt-2 flex items-center gap-1"><Icon name="alert" size={12} />{error}</p>}
        <p className="text-[10px] text-ink-faint mt-2">Podés inspeccionar varios vigiladores en la misma ronda.</p>
      </Clay>

      {sel.length === 0 ? (
        <Empty icon="users" title="Todavía no cargaste vigiladores"
          sub="Ingresá un número de legajo para traer sus datos desde el sistema." />
      ) : (
        <div className="flex flex-col gap-2.5">
          <Label>{sel.length} vigilador{sel.length > 1 ? "es" : ""} en esta ronda</Label>
          {sel.map((v, i) => {
            const dCred = diasHasta(v.credencial_venc);
            const alerta = (dCred != null && dCred <= 30) || v.estado !== "activo";
            return (
              <Clay key={v.id} className="p-3.5 a-up" style={{ animationDelay:`${i * 60}ms` }}>
                <div className="flex items-center gap-3">
                  <Avatar nombre={v.nombre} size={46} src={v.foto_url} tone={alerta ? "warn" : "brand"} />
                  <button onClick={() => setPerfil(v)} className="flex-1 min-w-0 text-left focus-ring rounded-lg">
                    <p className="text-[13px] font-black text-ink leading-tight truncate">{v.nombre}</p>
                    <p className="text-[10px] text-ink-mute mt-0.5 truncate">{v.puesto} · Legajo {v.legajo}</p>
                    <div className="flex gap-1.5 mt-1.5 flex-wrap">
                      <Badge tone={ESTADO_TONE[v.estado] || "gray"}>{v.estado}</Badge>
                      {dCred != null && dCred <= 30 && <Badge tone="bad" icon="alert">Credencial {dCred}d</Badge>}
                      {v.es_chofer && <Badge tone="brand" icon="car">Chofer</Badge>}
                    </div>
                  </button>
                  <div className="flex flex-col gap-1.5 shrink-0">
                    <button onClick={() => setPerfil(v)} aria-label={`Ver perfil de ${v.nombre}`}
                      className="clay-sm clay-press w-9 h-9 rounded-[12px] flex items-center justify-center text-brand-600 focus-ring">
                      <Icon name="eye" size={15} />
                    </button>
                    <button onClick={() => quitar(v.id)} aria-label={`Quitar a ${v.nombre}`}
                      className="clay-sm clay-press w-9 h-9 rounded-[12px] flex items-center justify-center text-bad focus-ring">
                      <Icon name="trash" size={15} />
                    </button>
                  </div>
                </div>
              </Clay>
            );
          })}
        </div>
      )}

      <div className="flex gap-2.5 mt-1">
        <Btn variant="white" icon="arrow-l" onClick={onBack} className="px-4">Atrás</Btn>
        <Btn full size="lg" disabled={sel.length === 0} onClick={onNext} iconRight="arrow-r">
          Continuar al checklist
        </Btn>
      </div>

      <Sheet open={!!perfil} onClose={() => setPerfil(null)} title="Perfil del vigilador" sub="Datos del legajo en el sistema">
        {perfil && <PerfilVigilador v={perfil} {...datosPerfil(perfil)} />}
      </Sheet>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PASO 3 — Checklist Likert por secciones (PRD §3 y §4)
═══════════════════════════════════════════════════════════ */
function ItemChecklist({ def, resp, onEstado, onAbrirObs }) {
  const [criterio, setCriterio] = useState(false);
  const timer = useRef(null);

  // Long-press abre el criterio completo; el botón "i" hace lo mismo de forma accesible
  const press   = () => { timer.current = setTimeout(() => setCriterio(true), 480); };
  const release = () => { clearTimeout(timer.current); };
  useEffect(() => () => clearTimeout(timer.current), []);

  const estado = resp?.estado || null;
  const obs    = [...(resp?.obsPred || []), ...(resp?.obsLibre ? [resp.obsLibre] : [])];

  /* Cada ítem es un asiento del libro: se apoya en el renglón y, si sale
     mal, toma el filete bermellón del margen. El estado lo lleva la marca
     (✓ · △ · ✕), no el tono: nada depende sólo del color. */
  const MARCA = { B:"check", R:"alert", M:"x" };

  return (
    <div className={cx("bg-paper border-b border-paper-rule transition-colors duration-150",
      estado === "M" ? "bg-bad-soft filete" : estado === "R" ? "bg-warn-soft" : "")}>
      <div className="px-3.5 py-3">
        <div className="flex items-start gap-2 mb-3">
          <p className="flex-1 text-[16px] font-semibold text-ink leading-snug no-select"
            onMouseDown={press} onMouseUp={release} onMouseLeave={release}
            onTouchStart={press} onTouchEnd={release} onTouchCancel={release}>
            {def.titulo_corto}
          </p>
          <button onClick={() => setCriterio(c => !c)} aria-label="Ver criterio de evaluación"
            className={cx("shrink-0 p-2 -m-1 focus-ring transition-colors", criterio ? "text-navy-700" : "text-ink-mute")}>
            <Icon name="info" size={17} />
          </button>
        </div>

        {criterio && (
          <div className="clay-inset px-3 py-2.5 mb-3 a-dn">
            <p className="text-[15px] text-ink-soft leading-relaxed">{def.criterio_completo}</p>
            <p className="rotulo mt-2">Área responsable · {def.area_responsable}</p>
          </div>
        )}

        {/* Tres teclas cuadradas: marca arriba, palabra abajo, siempre ambas */}
        <div className="flex">
          {["B","R","M"].map(k => {
            const v = VALOR[k], on = estado === k;
            const bg = { B:"bg-good", R:"bg-warn", M:"bg-bad" }[k];
            return (
              <button key={k} onClick={() => onEstado(k)}
                aria-pressed={on} aria-label={`${def.titulo_corto}: ${v.label}`}
                className={cx("clay-btn flex-1 min-h-[52px] flex flex-col items-center justify-center gap-0.5 border border-paper-rule -ml-px first:ml-0",
                  on ? cx(bg, "text-paper-hi border-transparent") : "bg-paper-hi text-ink-mute")}>
                <Icon name={MARCA[k]} size={18} strokeWidth={on ? 3 : 2.2} />
                <span className="text-[11px] font-bold uppercase" style={{ letterSpacing:".08em" }}>{v.label}</span>
              </button>
            );
          })}
        </div>
      </div>

      {(estado === "R" || estado === "M") && (
        <button onClick={onAbrirObs}
          className="w-full px-3.5 py-3 min-h-[48px] border-t border-ink/10 text-left clay-press focus-ring">
          {obs.length === 0 ? (
            <div className="flex items-center gap-2">
              <Icon name="alert" size={16} className={estado === "M" ? "text-bad-ink" : "text-warn-ink"} />
              <span className={cx("text-[15px] font-bold", estado === "M" ? "text-bad-ink" : "text-warn-ink")}>
                Registrá la observación
              </span>
              <Icon name="chevron-r" size={16} className="ml-auto text-ink-mute" />
            </div>
          ) : (
            <div>
              <div className="flex items-center gap-1.5 mb-1">
                <Icon name="ticket" size={13} className={estado === "M" ? "text-bad-ink" : "text-warn-ink"} />
                <span className={cx("rotulo", estado === "M" ? "text-bad-ink" : "text-warn-ink")}>Genera ticket</span>
                <Icon name="chevron-r" size={15} className="ml-auto text-ink-mute" />
              </div>
              <p className="text-[15px] text-ink-soft font-medium leading-snug">{obs.join(" · ")}</p>
            </div>
          )}
        </button>
      )}
    </div>
  );
}

function Step3({ rd, setRD, onNext, onBack }) {
  const { checklistDefs, secciones, observaciones, ajustes } = useApp();
  const [abierta, setAbierta] = useState(["seguridad"]);
  const [obsItem, setObsItem] = useState(null);
  const [tmpPred, setTmpPred] = useState([]);
  const [tmpLibre,setTmpLibre]= useState("");

  const respuestas = rd.respuestas || {};

  // Checklist propio del objetivo: plantilla del tipo + sus ajustes (PRD §6)
  const items = useMemo(
    () => resolverChecklist(rd.objetivo, checklistDefs, ajustes),
    [checklistDefs, ajustes, rd.objetivo]
  );

  const porSeccion = useMemo(() => {
    const g = {};
    for (const s of secciones) g[s.clave] = items.filter(i => i.seccion_clave === s.clave).sort((a,b) => a.orden - b.orden);
    return g;
  }, [items, secciones]);

  const total     = items.length;
  const completos = items.filter(i => respuestas[i.id]?.estado).length;
  const pendientes= total - completos;

  // Un ítem R/M sin observación bloquea el avance (PRD §3.1)
  const sinObs = items.filter(i => {
    const r = respuestas[i.id];
    return (r?.estado === "R" || r?.estado === "M") && !(r.obsPred?.length || r.obsLibre?.trim());
  });

  const tickets = items.filter(i => ["R","M"].includes(respuestas[i.id]?.estado));

  const setEstado = (item, estado) => {
    setRD(p => {
      const prev = p.respuestas?.[item.id] || {};
      const next = estado === "B"
        ? { estado:"B", obsPred:[], obsLibre:"" }
        : { ...prev, estado };
      return { ...p, respuestas: { ...(p.respuestas || {}), [item.id]: next } };
    });
    if (estado !== "B") abrirObs(item, estado);
  };

  const abrirObs = (item, estadoForzado) => {
    const r = respuestas[item.id] || {};
    setTmpPred(r.obsPred || []); setTmpLibre(r.obsLibre || "");
    setObsItem({ ...item, _estado: estadoForzado || r.estado });
  };

  const guardarObs = () => {
    setRD(p => ({
      ...p,
      respuestas: {
        ...(p.respuestas || {}),
        [obsItem.id]: { ...(p.respuestas?.[obsItem.id] || {}), obsPred: tmpPred, obsLibre: tmpLibre.trim() },
      },
    }));
    setObsItem(null);
  };

  const toggleSec = (clave) => setAbierta(a => a.includes(clave) ? a.filter(x => x !== clave) : [...a, clave]);

  // Observaciones sugeridas: primero el área del ítem, luego el resto
  const obsAgrupadas = useMemo(() => {
    if (!obsItem) return [];
    const area = obsItem.area_responsable;
    const g = {};
    for (const o of observaciones) (g[o.area] = g[o.area] || []).push(o);
    return Object.entries(g).sort(([a],[b]) => (a === area ? -1 : b === area ? 1 : a.localeCompare(b)));
  }, [obsItem, observaciones]);

  return (
    <div className="flex flex-col gap-3.5 px-4 py-4 a-fade">
      <SH title="Checklist de ronda"
        sub={`${cortar(rd.objetivo?.nombre || "Objetivo", 30)} · ${SUBTIPO_LABEL[rd.objetivo?.subtipo] || ""} · ${total} ítems`} />

      {/* Progreso */}
      <Clay className="p-4">
        <div className="flex items-center justify-between mb-2.5">
          <div>
            <p className="text-[13px] font-black text-ink">{completos} de {total} ítems evaluados</p>
            <p className="text-[10px] text-ink-faint mt-0.5">
              {pendientes > 0 ? `Faltan ${pendientes}` : "Checklist completo"}
              {tickets.length > 0 && ` · ${tickets.length} incidencia${tickets.length > 1 ? "s" : ""}`}
            </p>
          </div>
          <span className="text-2xl font-black text-brand-600 tnum">{total ? Math.round(completos / total * 100) : 0}%</span>
        </div>
        <Bar value={completos} max={total} color="#2D4175" height={9} />
      </Clay>

      {/* Secciones acordeón */}
      {secciones.map(s => {
        const arr = porSeccion[s.clave] || [];
        if (!arr.length) return null;
        const th   = SECCION_THEME[s.color] || SECCION_THEME.azul;
        const done = arr.filter(i => respuestas[i.id]?.estado).length;
        const open = abierta.includes(s.clave);
        const mal  = arr.filter(i => ["R","M"].includes(respuestas[i.id]?.estado)).length;
        return (
          <div key={s.clave}>
            <button onClick={() => toggleSec(s.clave)} aria-expanded={open}
              className="clay w-full flex items-center gap-3 p-3.5 clay-press focus-ring">
              <span className="w-10 h-10 rounded-[14px] flex items-center justify-center shrink-0"
                style={{ background:th.soft, color:th.ink }}>
                <Icon name={{ seguridad:"shield", habilidades:"target", logistica:"layers", rrhh:"users" }[s.clave] || "clipboard"} size={19} />
              </span>
              <div className="flex-1 min-w-0 text-left">
                <p className="text-[17px] font-bold text-ink leading-tight">{s.nombre}</p>
                <p className="text-[14px] text-ink-mute mt-1 tnum">
                  {done}/{arr.length} evaluados{mal > 0 ? ` · ${mal} con observación` : ""}
                </p>
              </div>
              {done === arr.length
                ? <span className="w-6 h-6 rounded-full bg-good-soft text-good-ink flex items-center justify-center shrink-0"><Icon name="check" size={13} strokeWidth={3} /></span>
                : <span className="folio text-[14px] px-2 py-1 shrink-0 border" style={{ background:th.soft, color:th.ink, borderColor:th.ink }}>{arr.length - done}</span>}
              <Icon name="chevron" size={16} className={cx("text-ink-faint transition-transform shrink-0", open && "rotate-180")} />
            </button>

            {open && (
              <div className="mt-2.5 border-t-2 border-ink">
                {arr.map((def, i) => (
                  <div key={def.id} className="a-up" style={{ animationDelay:`${i * 30}ms` }}>
                    <ItemChecklist def={def} resp={respuestas[def.id]}
                      onEstado={k => setEstado(def, k)} onAbrirObs={() => abrirObs(def)} />
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}

      {/* Tickets que se van a generar */}
      {tickets.length > 0 && (
        <Clay className="p-4 a-up" tint="linear-gradient(135deg,#F0E7CF,#F0E7CF)">
          <div className="flex items-center gap-2 mb-2">
            <Icon name="ticket" size={16} className="text-tang-ink" />
            <p className="text-[12px] font-black text-tang-ink">
              {tickets.length} ticket{tickets.length > 1 ? "s" : ""} se generará{tickets.length > 1 ? "n" : ""} al guardar
            </p>
          </div>
          <div className="flex flex-col gap-1">
            {tickets.map(t => {
              const r = respuestas[t.id];
              const area = observaciones.find(o => o.texto === r.obsPred?.[0])?.area || t.area_responsable;
              return (
                <div key={t.id} className="flex items-center gap-2">
                  <Badge tone={r.estado === "M" ? "bad" : "warn"}>{VALOR[r.estado].label}</Badge>
                  <span className="text-[11px] text-ink-soft font-semibold truncate flex-1">{t.titulo_corto}</span>
                  <span className="text-[10px] text-ink-faint font-bold shrink-0">{area}</span>
                </div>
              );
            })}
          </div>
        </Clay>
      )}

      {sinObs.length > 0 && (
        <div className="bg-warn-soft rounded-[16px] px-4 py-3 flex items-start gap-2">
          <Icon name="alert" size={15} className="text-warn-ink mt-px" />
          <p className="text-[11px] font-bold text-warn-ink leading-snug">
            {sinObs.length} ítem{sinObs.length > 1 ? "s" : ""} marcado{sinObs.length > 1 ? "s" : ""} como Regular o Malo
            sin observación. Tocá la fila para completarla.
          </p>
        </div>
      )}

      <div className="flex gap-2.5">
        <Btn variant="white" icon="arrow-l" onClick={onBack} className="px-4">Atrás</Btn>
        <Btn full size="lg" disabled={pendientes > 0 || sinObs.length > 0} onClick={onNext} iconRight="arrow-r">
          {pendientes > 0 ? `Faltan ${pendientes} ítems` : sinObs.length > 0 ? "Completá las observaciones" : "Continuar a evidencia"}
        </Btn>
      </div>

      {/* Hoja de observaciones predefinidas */}
      <Sheet open={!!obsItem} onClose={() => setObsItem(null)}
        title={obsItem?.titulo_corto} sub={`Valoración ${obsItem ? VALOR[obsItem._estado]?.label : ""} · elegí la observación que corresponda`}>
        {obsItem && (
          <div className="flex flex-col gap-4">
            <div className="clay-inset px-3.5 py-3">
              <p className="text-[11px] text-ink-soft leading-relaxed">{obsItem.criterio_completo}</p>
            </div>

            {obsAgrupadas.map(([area, arr]) => (
              <div key={area}>
                <div className="flex items-center gap-2 mb-2">
                  <Badge tone={AREA_THEME[area]?.tone || "gray"}>{area}</Badge>
                  {area === obsItem.area_responsable && <span className="text-[10px] font-bold text-ink-faint">sugerida</span>}
                </div>
                <div className="flex flex-col gap-1.5">
                  {arr.map(o => {
                    const on = tmpPred.includes(o.texto);
                    return (
                      <button key={o.texto}
                        onClick={() => setTmpPred(p => on ? p.filter(x => x !== o.texto) : [...p, o.texto])}
                        className={cx("clay-press flex items-center gap-2.5 px-3.5 py-3 rounded-[15px] text-left transition-all focus-ring",
                          on ? "bg-brand-600 text-paper-hi" : "clay-sm text-ink-soft")}>
                        <span className={cx("w-4.5 h-4.5 rounded-md flex items-center justify-center shrink-0 border-2",
                          on ? "bg-paper-hi/25 border-paper-hi/50" : "border-paper-rule")} style={{ width:18, height:18 }}>
                          {on && <Icon name="check" size={11} strokeWidth={3.5} />}
                        </span>
                        <span className="text-[12px] font-semibold leading-snug">{o.texto}</span>
                      </button>
                    );
                  })}
                </div>
              </div>
            ))}

            <Textarea label="Otra observación" value={tmpLibre} onChange={e => setTmpLibre(e.target.value)} rows={3}
              placeholder="Describí la situación si no está en el listado…" />

            <div className="flex gap-2.5 pb-1">
              <Btn variant="white" onClick={() => setObsItem(null)} className="px-5">Cancelar</Btn>
              <Btn full size="lg" icon="check" disabled={!tmpPred.length && !tmpLibre.trim()} onClick={guardarObs}>
                Guardar observación
              </Btn>
            </div>
          </div>
        )}
      </Sheet>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PASO 4 — Evidencia fotográfica con marca de agua (PRD §8.5)
═══════════════════════════════════════════════════════════ */
function Step4({ rd, setRD, onNext, onBack, supervisor }) {
  const [cargando, setCargando] = useState(false);
  const [ver, setVer] = useState(null);
  const inputRef = useRef(null);
  const fotos = rd.fotos || [];

  const tomar = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    setCargando(true);
    const now = new Date();

    // GPS real al momento de la captura; si no hay señal, cae a la última posición conocida del dispositivo (paso 1)
    let lat = rd.deviceCoords?.lat, lng = rd.deviceCoords?.lng;
    if (navigator.geolocation) {
      try {
        const pos = await new Promise((res, rej) =>
          navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 8000, maximumAge: 4000 }));
        lat = pos.coords.latitude; lng = pos.coords.longitude;
      } catch { /* se mantiene el fallback */ }
    }

    for (const file of files) {
      const dataUrl = await new Promise(res => {
        const fr = new FileReader();
        fr.onload = () => res(fr.result);
        fr.readAsDataURL(file);
      });
      const estampada = await estamparFoto(dataUrl, {
        l1: `${fmtFecha(now)} · ${now.toLocaleTimeString("es-AR")}`,
        l2: lat != null ? `GPS ${lat.toFixed(5)}, ${lng.toFixed(5)}` : "GPS no disponible",
        l3: `${supervisor} · ${rd.objetivo?.nombre || ""}`,
      });
      setRD(p => ({ ...p, fotos: [...(p.fotos || []), { dataUrl: estampada, lat, lng, ts: now.toISOString() }] }));
    }
    setCargando(false);
    e.target.value = "";
  };

  const quitar = (i) => setRD(p => ({ ...p, fotos: (p.fotos || []).filter((_, k) => k !== i) }));

  return (
    <div className="flex flex-col gap-4 px-4 py-4 a-fade">
      <SH title="Evidencia fotográfica" sub="Opcional · cada foto se sella con fecha, hora, GPS y supervisor" />

      <input ref={inputRef} type="file" accept="image/*" capture="environment" multiple onChange={tomar} className="hidden" />

      <button onClick={() => inputRef.current?.click()} disabled={cargando}
