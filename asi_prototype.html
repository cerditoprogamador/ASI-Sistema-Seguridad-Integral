          <Icon name={cargando ? "refresh" : "camera"} size={28} className={cargando ? "a-spin" : ""} />
        </span>
        <div className="text-center">
          <p className="text-sm font-black text-ink">{cargando ? "Procesando…" : "Capturar evidencia"}</p>
          <p className="text-[11px] text-ink-faint mt-0.5">Cámara o galería · se puede sumar más de una</p>
        </div>
      </button>

      {fotos.length > 0 && (
        <div>
          <Label className="mb-2">{fotos.length} foto{fotos.length > 1 ? "s" : ""} adjunta{fotos.length > 1 ? "s" : ""}</Label>
          <div className="grid grid-cols-2 gap-2.5">
            {fotos.map((f, i) => (
              <div key={i} className="clay p-1.5 a-pop relative overflow-hidden" style={{ animationDelay:`${i * 60}ms` }}>
                <button onClick={() => setVer(f)} className="block w-full focus-ring rounded-[16px] overflow-hidden">
                  <img src={f.dataUrl} alt={`Evidencia ${i + 1}`} className="w-full h-28 object-cover rounded-[16px]" />
                </button>
                <button onClick={() => quitar(i)} aria-label="Quitar foto"
                  className="absolute top-3 right-3 w-7 h-7 rounded-full bg-paper-hi/95 text-bad flex items-center justify-center shadow-md">
                  <Icon name="x" size={14} strokeWidth={2.6} />
                </button>
              </div>
            ))}
          </div>
        </div>
      )}

      <Clay className="p-3.5 flex items-start gap-2.5" tint="linear-gradient(135deg,#EFF2F7,#DEE5F0)">
        <Icon name="stamp" size={16} className="text-brand-700 mt-px" />
        <p className="text-[11px] text-brand-800 leading-relaxed font-medium">
          La marca de agua se aplica al momento de la captura y no puede modificarse después.
        </p>
      </Clay>

      <div className="flex gap-2.5">
        <Btn variant="white" icon="arrow-l" onClick={onBack} className="px-4">Atrás</Btn>
        <Btn full size="lg" onClick={onNext} iconRight="arrow-r">
          {fotos.length ? "Continuar a firmas" : "Omitir y firmar"}
        </Btn>
      </div>

      <Sheet open={!!ver} onClose={() => setVer(null)} title="Evidencia" sub="Marca de agua no editable">
        {ver && <img src={ver.dataUrl} alt="Evidencia ampliada" className="w-full rounded-[18px]" />}
      </Sheet>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PASO 5 — Firma individual por vigilador (PRD §5.2)
═══════════════════════════════════════════════════════════ */
function CanvasFirma({ onChange, disabled }) {
  const ref     = useRef(null);
  const dibuja  = useRef(false);
  const trazado = useRef(false); // ref, no estado: `stop` corre en el mismo tick que el último `move`
  const ultimo  = useRef(null);
  const [hay, setHay] = useState(false);

  const pos = (e, cv) => {
    const r = cv.getBoundingClientRect();
    const sx = cv.width / r.width, sy = cv.height / r.height;
    const p = e.touches ? e.touches[0] : e;
    return { x: (p.clientX - r.left) * sx, y: (p.clientY - r.top) * sy };
  };

  const start = e => { if (disabled) return; dibuja.current = true; ultimo.current = pos(e, ref.current); };
  const move  = e => {
    if (!dibuja.current || disabled) return;
    e.preventDefault();
    const cv = ref.current, ctx = cv.getContext("2d"), p = pos(e, cv);
    ctx.beginPath();
    ctx.strokeStyle = "#1C2A4E"; ctx.lineWidth = 2.8; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.moveTo(ultimo.current.x, ultimo.current.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ultimo.current = p;
    if (!trazado.current) { trazado.current = true; setHay(true); }
  };
  const stop = () => {
    if (!dibuja.current) return;
    dibuja.current = false;
    if (trazado.current) onChange(ref.current.toDataURL("image/png"));
  };
  const limpiar = () => {
    const cv = ref.current;
    cv.getContext("2d").clearRect(0, 0, cv.width, cv.height);
    trazado.current = false; setHay(false); onChange(null);
  };

  useEffect(() => { if (disabled) limpiar(); }, [disabled]);

  return (
    <div>
      <div className={cx("clay-inset overflow-hidden transition-all", disabled && "opacity-40")}>
        <canvas ref={ref} width={340} height={140} className="w-full sig-canvas"
          onMouseDown={start} onMouseMove={move} onMouseUp={stop} onMouseLeave={stop}
          onTouchStart={start} onTouchMove={move} onTouchEnd={stop} />
      </div>
      <div className="flex items-center justify-between mt-2">
        <p className="text-[10px] text-ink-faint font-medium">
          {disabled ? "Negativa registrada" : hay ? "Firma capturada" : "Firmá con el dedo o el cursor"}
        </p>
        {hay && !disabled && (
          <button onClick={limpiar} className="text-[10px] font-black text-brand-600 flex items-center gap-1 focus-ring rounded px-1">
            <Icon name="refresh" size={12} /> Rehacer
          </button>
        )}
      </div>
    </div>
  );
}

function Step5({ rd, setRD, onGuardar, onBack, guardando }) {
  const { offline, apiStatus } = useApp();
  const vigs   = rd.vigiladores || [];
  const firmas = rd.firmas || {};
  const [activo, setActivo] = useState(vigs[0]?.id);

  const setFirma = (id, dataUrl) => setRD(p => ({
    ...p, firmas: { ...(p.firmas || {}), [id]: { ...(p.firmas?.[id] || {}), dataUrl } },
  }));
  const setNego = (id) => setRD(p => {
    const prev = p.firmas?.[id] || {};
    return { ...p, firmas: { ...(p.firmas || {}), [id]: { dataUrl: prev.nego ? prev.dataUrl : null, nego: !prev.nego } } };
  });

  const firmados = vigs.filter(v => firmas[v.id]?.dataUrl || firmas[v.id]?.nego).length;
  const puede    = firmados > 0 && firmados === vigs.length;
  const negativas= vigs.filter(v => firmas[v.id]?.nego);

  const items = Object.entries(rd.respuestas || {});
  const inc   = items.filter(([, r]) => r.estado === "R" || r.estado === "M").length;

  return (
    <div className="flex flex-col gap-4 px-4 py-4 a-fade">
      <SH title="Firma y cierre" sub="Cada vigilador inspeccionado debe firmar el acta" />

      {/* Resumen del acta */}
      <Clay className="p-4">
        <Label className="mb-2.5">Resumen de la ronda</Label>
        <Row k="Objetivo"    v={rd.objetivo?.nombre || "—"} />
        <Row k="Modalidad"   v={rd.tipo === "remota" ? "Remota" : "Presencial"} tone={rd.tipo === "remota" ? "warn" : "good"} />
        <Row k="Geocerca"    v={rd.gpsStatus === "inside" ? "Dentro" : "Fuera"} tone={rd.gpsStatus === "inside" ? "good" : "bad"} />
        <Row k="Vigiladores" v={vigs.length} />
        <Row k="Ítems evaluados" v={items.length} />
        <Row k="Incidencias" v={inc} tone={inc > 0 ? "bad" : "good"} />
        <Row k="Evidencia"   v={`${(rd.fotos || []).length} fotos`} last />
      </Clay>

      {/* Progreso de firmas */}
      <Clay className="p-3.5">
        <div className="flex items-center justify-between mb-2">
          <p className="text-[12px] font-black text-ink">{firmados} de {vigs.length} firmas registradas</p>
          {puede && <Badge tone="good" icon="check">Completo</Badge>}
        </div>
        <Bar value={firmados} max={vigs.length} color="#1F6B4A" height={8} />
      </Clay>

      {/* Selector de vigilador */}
      {vigs.length > 1 && (
        <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
          {vigs.map(v => {
            const f = firmas[v.id];
            const ok = f?.dataUrl || f?.nego;
            return (
              <button key={v.id} onClick={() => setActivo(v.id)}
                className={cx("clay-btn shrink-0 px-3.5 py-2.5 rounded-[15px] flex items-center gap-2 text-[11px] font-black transition-all",
                  activo === v.id ? "bg-brand-600 text-paper-hi" : "bg-paper-hi text-ink-mute")}>
                {ok && <Icon name={f.nego ? "x-circle" : "check-circle"} size={13} />}
                {cortar(v.nombre.split(" ")[0] + " " + (v.nombre.split(" ").slice(-1)[0] || ""), 16)}
              </button>
            );
          })}
        </div>
      )}

      {/* Panel de firma del vigilador activo */}
      {vigs.filter(v => v.id === activo).map(v => {
        const f = firmas[v.id] || {};
        return (
          <Clay key={v.id} className="p-4 a-fade">
            <div className="flex items-center gap-3 mb-3.5">
              <Avatar nombre={v.nombre} size={44} src={v.foto_url} />
              <div className="min-w-0">
                <p className="text-[13px] font-black text-ink leading-tight truncate">{v.nombre}</p>
                <p className="text-[10px] text-ink-mute">Legajo {v.legajo} · DNI {v.dni || "—"}</p>
              </div>
            </div>

            {f.nego ? (
              <div className="clay-inset py-9 flex flex-col items-center gap-2">
                <Icon name="x-circle" size={30} className="text-bad" />
                <p className="text-[12px] font-black text-bad-ink">Negativa a firmar registrada</p>
              </div>
            ) : (
              <CanvasFirma onChange={d => setFirma(v.id, d)} disabled={false} />
            )}

            <button onClick={() => setNego(v.id)}
              className={cx("clay-btn w-full mt-3 py-3 rounded-[15px] text-[11px] font-black flex items-center justify-center gap-2",
                f.nego ? "bg-bad text-paper-hi" : "bg-paper-hi text-bad")}>
              <Icon name={f.nego ? "refresh" : "x-circle"} size={15} />
              {f.nego ? "Deshacer negativa" : "Registrar negativa a firmar"}
            </button>
          </Clay>
        );
      })}

      {negativas.length > 0 && (
        <div className="bg-bad-soft rounded-[16px] px-4 py-3 flex items-start gap-2 a-up">
          <Icon name="alert" size={15} className="text-bad-ink mt-px" />
          <p className="text-[11px] font-bold text-bad-ink leading-snug">
            {negativas.length} negativa{negativas.length > 1 ? "s" : ""} a firmar · se generará un ticket a RRHH por cada una.
          </p>
        </div>
      )}

      {offline && (
        <div className="bg-warn-soft rounded-[16px] px-4 py-3 flex items-start gap-2">
          <Icon name="cloud-off" size={15} className="text-warn-ink mt-px" />
          <p className="text-[11px] font-bold text-warn-ink leading-snug">
            Sin conexión: el acta se guarda en el dispositivo y se sincroniza automáticamente al recuperar señal.
          </p>
        </div>
      )}

      <div className="flex gap-2.5">
        <Btn variant="white" icon="arrow-l" onClick={onBack} className="px-4">Atrás</Btn>
        <Btn full size="xl" variant={offline ? "warn" : "success"} icon={offline ? "cloud-off" : "save"}
          disabled={!puede} loading={guardando} onClick={onGuardar}>
          {guardando ? "Guardando…" : !puede ? `Faltan ${vigs.length - firmados} firmas` : offline ? "Guardar en cola" : "Guardar acta"}
        </Btn>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PASO 6 — Acta de supervisión generada (PRD §5.1)
═══════════════════════════════════════════════════════════ */
function ActaGenerada({ rd, resultado, supervisor, onNueva }) {
  const { checklistDefs } = useApp();
  const { acta, estado, servidor, aviso } = resultado;
  const encolada = estado === "encolada";
  const fin = acta.generadaEn || new Date();

  const respuestas = Object.entries(rd.respuestas || {}).map(([id, r]) => ({
    def: checklistDefs.find(d => String(d.id) === String(id)) || { titulo_corto:"Ítem" }, r,
  }));
  const conObs = respuestas.filter(({ r }) => r.estado === "R" || r.estado === "M");

  return (
    <div className="flex flex-col gap-4 px-4 py-5 a-fade">
      {/* Confirmación */}
      <div className="pb-1">
        <h2 className="display text-[22px] text-ink">
          {encolada ? "Acta guardada localmente" : "Acta registrada"}
        </h2>
        <p className="text-[15px] text-ink-mute mt-2 leading-relaxed">
          {encolada
            ? "Sin conexión. Se enviará automáticamente al recuperar señal."
            : servidor
              ? "Sellada digitalmente y sincronizada con el servidor."
              : "Sellada digitalmente. Los paneles se actualizaron al instante."}
        </p>
        {aviso && <p className="text-[14px] text-warn-ink font-bold mt-2">{aviso}</p>}
      </div>

      {/* El acta: hoja con su filete de margen y el sello asentado encima */}
      <Clay className="overflow-hidden filete relative">
        {/* Encabezado del folio */}
        <div className="tela px-4 py-4 text-paper-hi border-b-2 border-navy-900">
          <div className="flex items-center gap-3">
            <span className="text-foil shrink-0"><Isotipo size={34} /></span>
            <div className="min-w-0">
              <p className="display text-[15px] leading-tight">Argentina Seguridad Integral</p>
              <p className="rotulo text-foil mt-1">Acta de supervisión · ASISA</p>
            </div>
          </div>
        </div>

        {/* El código es el titular, no un epígrafe al pie.
            Lleva su propio casillero: el sello cae al lado, nunca encima. */}
        <div className="px-4 pt-4 pb-4 border-b border-paper-rule flex items-end justify-between gap-3">
          <div className="min-w-0">
            <Label className="mb-1.5">Folio</Label>
            <p className="folio text-[20px] text-ink leading-none whitespace-nowrap">{acta.codigo}</p>
          </div>

          {/* El asentado: el único momento autorado de la aplicación */}
          <div className={cx("sello shrink-0 px-2.5 py-1.5 no-select pointer-events-none",
            encolada && "text-warn")} aria-hidden="true">
            <span className="block text-[12px] font-black uppercase leading-none" style={{ letterSpacing:".1em" }}>
              {encolada ? "En cola" : "Asentado"}
            </span>
            <span className="block text-[10px] font-bold tnum text-center mt-1">{fmtFecha(fin)}</span>
          </div>
        </div>

        <div className="p-4 flex flex-col gap-4">
          {/* Objetivo */}
          <div>
            <Label className="mb-1.5">Objetivo</Label>
            <p className="text-[17px] font-bold text-ink leading-tight">{rd.objetivo?.nombre}</p>
            <p className="text-[15px] text-ink-mute mt-1">{rd.objetivo?.direccion || "—"}</p>
            <p className="text-[14px] text-ink-mute mt-1 tnum">
              {SUBTIPO_LABEL[rd.objetivo?.subtipo]}
              {rd.objetivo?.lat != null && ` · ${rd.objetivo.lat.toFixed(5)}, ${rd.objetivo.lng.toFixed(5)}`}
            </p>
          </div>

          <div className="h-px bg-paper-rule" />

          {/* Datos de la ronda */}
          <div>
            <Row k="Supervisor"    v={supervisor} />
            <Row k="Inicio"        v={rd.horaInicio ? `${fmtFecha(rd.horaInicio)} · ${fmtHora(rd.horaInicio)}` : "—"} />
            <Row k="Cierre"        v={`${fmtFecha(fin)} · ${fmtHora(fin)}`} />
            <Row k="Modalidad"     v={rd.tipo === "remota" ? "Remota" : "Presencial"} tone={rd.tipo === "remota" ? "warn" : "good"} />
            <Row k="Validación GPS"v={rd.gpsStatus === "inside" ? "Dentro del geocerco" : "Fuera del geocerco"} tone={rd.gpsStatus === "inside" ? "good" : "bad"} last />
          </div>

          {rd.justificacion && (
            <div className="clay-inset px-3.5 py-3">
              <Label className="mb-1">Justificación de supervisión remota</Label>
              <p className="text-[11px] text-ink-soft leading-relaxed">{rd.justificacion}</p>
            </div>
          )}

          <div className="h-px bg-paper-bed" />

          {/* Vigiladores + firmas */}
          <div>
            <Label className="mb-2">Vigiladores inspeccionados</Label>
            <div className="flex flex-col gap-2.5">
              {(rd.vigiladores || []).map(v => {
                const f = rd.firmas?.[v.id] || {};
                return (
                  <div key={v.id} className="clay-inset p-3">
                    <div className="flex items-center justify-between gap-2 mb-2">
                      <div className="min-w-0">
                        <p className="text-[12px] font-black text-ink truncate">{v.nombre}</p>
                        <p className="text-[10px] text-ink-faint">Legajo {v.legajo} · DNI {v.dni || "—"}</p>
                      </div>
                      <Badge tone={f.nego ? "bad" : "good"}>{f.nego ? "No firmó" : "Firmado"}</Badge>
                    </div>
                    {f.dataUrl
                      ? <div className="bg-paper-hi rounded-[12px] p-1"><img src={f.dataUrl} alt={`Firma de ${v.nombre}`} className="w-full h-16 object-contain" /></div>
                      : <div className="bg-paper-hi rounded-[12px] h-16 flex items-center justify-center">
                          <p className="text-[10px] font-bold text-bad-ink">Negativa registrada · ticket a RRHH</p>
                        </div>}
                  </div>
                );
              })}
            </div>
          </div>

          <div className="h-px bg-paper-bed" />

          {/* Resultado del checklist */}
          <div>
            <Label className="mb-2">Resultado del checklist</Label>
            <div className="flex gap-2 mb-2.5">
              {["B","R","M"].map(k => {
                const n = respuestas.filter(({ r }) => r.estado === k).length;
                return (
                  <div key={k} className={cx("flex-1 rounded-[13px] py-2 text-center",
                    k === "B" ? "bg-good-soft" : k === "R" ? "bg-warn-soft" : "bg-bad-soft")}>
                    <p className={cx("text-lg font-black tnum leading-none",
                      k === "B" ? "text-good-ink" : k === "R" ? "text-warn-ink" : "text-bad-ink")}>{n}</p>
                    <p className={cx("text-[9px] font-bold mt-0.5",
                      k === "B" ? "text-good-ink" : k === "R" ? "text-warn-ink" : "text-bad-ink")}>{VALOR[k].label}</p>
                  </div>
                );
              })}
            </div>
            <div className="flex flex-col">
              {respuestas.map(({ def, r }, i) => (
                <div key={i} className={cx("flex items-center gap-2 py-2", i < respuestas.length - 1 && "border-b border-paper-rule")}>
                  <span className={cx("w-5 h-5 rounded-md flex items-center justify-center shrink-0 text-paper-hi",
                    r.estado === "B" ? "bg-good" : r.estado === "R" ? "bg-warn" : "bg-bad")}>
                    <Icon name={VALOR[r.estado].icon} size={11} strokeWidth={3} />
                  </span>
                  <span className="text-[11px] text-ink-soft font-semibold flex-1 leading-snug">{def.titulo_corto}</span>
                </div>
              ))}
            </div>
          </div>

          {/* Observaciones e incidencias */}
          {conObs.length > 0 && (
            <>
              <div className="h-px bg-paper-bed" />
              <div>
                <Label className="mb-2">Observaciones e incidencias</Label>
                <div className="flex flex-col gap-2">
                  {conObs.map(({ def, r }, i) => {
                    const tk = acta.tickets.find(t => t.item === def.titulo_corto);
                    return (
                      <div key={i} className={cx("rounded-[14px] p-3", r.estado === "M" ? "bg-bad-soft" : "bg-warn-soft")}>
                        <div className="flex items-center gap-2 mb-1">
                          <Badge tone={r.estado === "M" ? "bad" : "warn"}>{VALOR[r.estado].label}</Badge>
                          {tk && <span className="text-[10px] font-mono font-black text-ink-mute">{tk.id}</span>}
                        </div>
                        <p className="text-[11px] font-black text-ink">{def.titulo_corto}</p>
                        <p className="text-[11px] text-ink-soft mt-0.5 leading-snug">
                          {[...(r.obsPred || []), r.obsLibre].filter(Boolean).join(" · ")}
                        </p>
                        {tk && <p className="text-[10px] text-ink-faint mt-1 font-bold">Área responsable: {tk.area}</p>}
                      </div>
                    );
                  })}
                </div>
              </div>
            </>
          )}

          {/* Evidencia */}
          {(rd.fotos || []).length > 0 && (
            <>
              <div className="h-px bg-paper-bed" />
              <div>
                <Label className="mb-2">Evidencia fotográfica</Label>
                <div className="grid grid-cols-3 gap-2">
                  {rd.fotos.map((f, i) => (
                    <img key={i} src={f.dataUrl} alt={`Evidencia ${i + 1}`} className="w-full h-20 object-cover rounded-[12px]" />
                  ))}
                </div>
              </div>
            </>
          )}

          {/* Sello */}
          <div className="clay-inset px-3.5 py-3">
            <div className="flex items-start gap-2">
              <Icon name="stamp" size={16} className="text-brand-700 mt-px" />
              <div>
                <p className="text-[10px] font-black text-brand-800 uppercase tracking-wide">Sello digital · no modificable</p>
                <p className="text-[10px] text-ink-mute mt-1 font-mono leading-relaxed">
                  {fmtFecha(fin)} {fin.toLocaleTimeString("es-AR")}<br />
                  {rd.deviceCoords?.lat != null ? `GPS ${rd.deviceCoords.lat.toFixed(5)}, ${rd.deviceCoords.lng.toFixed(5)}` : "GPS no disponible"}<br />
                  {supervisor}
                </p>
              </div>
            </div>
          </div>
        </div>
      </Clay>

      {/* Tickets emitidos */}
      {acta.tickets.length > 0 && (
        <Clay className="p-4">
          <div className="flex items-center gap-2 mb-2.5">
            <Icon name="send" size={16} className="text-brand-600" />
            <p className="text-[12px] font-black text-ink">
              {acta.tickets.length} ticket{acta.tickets.length > 1 ? "s" : ""} {encolada ? "pendiente de envío" : "enviado a las áreas"}
            </p>
          </div>
          <div className="flex flex-col gap-2">
            {acta.tickets.map(t => (
              <div key={t.id} className="clay-inset px-3 py-2.5 flex items-center gap-2">
                <Badge tone={AREA_THEME[t.area]?.tone || "gray"}>{t.area}</Badge>
                <span className="text-[11px] text-ink-soft font-semibold truncate flex-1">{t.item}</span>
                <span className="text-[9px] font-mono font-black text-ink-faint shrink-0">{t.id}</span>
              </div>
            ))}
          </div>
        </Clay>
      )}

      <Btn full size="xl" icon="refresh" onClick={onNueva}>Iniciar nueva ronda</Btn>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PANEL SUPERVISOR — wizard de 5 pasos + acta
═══════════════════════════════════════════════════════════ */
const PASOS = ["Inicio", "Vigiladores", "Checklist", "Evidencia", "Firmas"];

function SupervisorPanel() {
  const { currentUser, guardarRonda } = useApp();
  const [paso, setPaso] = useState(0);
  const [rd,   setRD]   = useState({});
  const [res,  setRes]  = useState(null);
  const [busy, setBusy] = useState(false);
  const scrollRef = useRef(null);

  const supervisor = currentUser?.nombre || "Supervisor";

  const ir = (n) => { setPaso(n); scrollRef.current?.scrollTo({ top:0, behavior:"smooth" }); };
  const reiniciar = () => { setRD({}); setRes(null); ir(0); };

  const guardar = async () => {
    setBusy(true);
    const r = await guardarRonda(rd, supervisor);
    setRes(r); setBusy(false);
    scrollRef.current?.scrollTo({ top:0, behavior:"smooth" });
  };

  const pantallas = [
    <Step1 rd={rd} setRD={setRD} onNext={() => ir(1)} />,
    <Step2 rd={rd} setRD={setRD} onNext={() => ir(2)} onBack={() => ir(0)} />,
    <Step3 rd={rd} setRD={setRD} onNext={() => ir(3)} onBack={() => ir(1)} />,
    <Step4 rd={rd} setRD={setRD} onNext={() => ir(4)} onBack={() => ir(2)} supervisor={supervisor} />,
    <Step5 rd={rd} setRD={setRD} onGuardar={guardar} onBack={() => ir(3)} guardando={busy} />,
  ];

  return (
    <div className="flex flex-col h-full">
      <PanelHeader icon="shield" rol="Supervisor de campo" nombre={supervisor} tone="brand" />
      <ConnBar />
      <SyncToast />
      {!res && <Stepper steps={PASOS} current={paso} />}
      <div ref={scrollRef} className="scroll-y flex-1">
        {res
          ? <ActaGenerada rd={rd} resultado={res} supervisor={supervisor} onNueva={reiniciar} />
          : pantallas[paso]}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PANEL ADMINISTRATIVO — gestión de incidencias
═══════════════════════════════════════════════════════════ */
function AdminPanel() {
  const { ticketsActivos, cerrarTicket, apiStatus, apiFetch, currentUser } = useApp();
  const [apiTickets, setApiTickets] = useState(null);
  const [cargando,   setCargando]   = useState(false);
  const [filtro,     setFiltro]     = useState("activo");
  const [area,       setArea]       = useState("todas");
  const [sel,        setSel]        = useState(null);
  const [resol,      setResol]      = useState("");
  const [cerrando,   setCerrando]   = useState(false);

  const conApi  = apiStatus === "connected" && apiTickets !== null;
  const tickets = conApi ? apiTickets : ticketsActivos;

  useEffect(() => {
    if (apiStatus !== "connected") { setApiTickets(null); return; }
    setCargando(true);
    apiFetch("/api/tickets?limite=100").then(r => r.json()).then(d => {
      if (!d.ok) return;
      setApiTickets(d.tickets.map(t => ({
        id: t.codigo_ticket, _dbId: t.id, obj: t.objetivo, sup: t.supervisor,
        val: t.valoracion || "R", area: t.area_responsable, item: t.item_titulo,
        vig: t.vigilador, estado: t.estado === "ABIERTO" ? "Activo" : "Cerrado",
        desc: t.descripcion, resolucion: t.resolucion,
        fecha: new Date(t.fecha_creacion).toLocaleString("es-AR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" }),
        isNew: false,
      })));
    }).catch(e => console.warn("[tickets]", e.message)).finally(() => setCargando(false));
  }, [apiStatus]);

  const stats = {
    crit: tickets.filter(t => t.val === "M" && t.estado === "Activo").length,
    act:  tickets.filter(t => t.estado === "Activo").length,
    cer:  tickets.filter(t => t.estado === "Cerrado").length,
  };

  const areas = useMemo(() => {
    const s = {};
    for (const t of tickets) if (t.estado === "Activo") s[t.area] = (s[t.area] || 0) + 1;
    return s;
  }, [tickets]);

  const lista = tickets.filter(t =>
    (filtro === "todas" || (filtro === "activo" ? t.estado === "Activo" : t.estado === "Cerrado")) &&
    (area === "todas" || t.area === area)
  );

  const actual = sel ? tickets.find(t => t.id === sel.id) || sel : null;

  const confirmarCierre = async () => {
    setCerrando(true);
    if (conApi && actual?._dbId) {
      try { await apiFetch(`/api/tickets/${actual._dbId}/resolver`, { method:"PATCH", body: JSON.stringify({ resolucion: resol }) }); }
      catch (e) { console.warn("[cerrar]", e.message); }
      setApiTickets(ts => ts.map(t => t.id === actual.id ? { ...t, estado:"Cerrado", resolucion: resol } : t));
    } else {
      cerrarTicket(actual.id, resol);
    }
    setCerrando(false); setSel(null); setResol("");
  };

  return (
    <div className="flex flex-col h-full">
      <PanelHeader icon="clipboard" rol="Gestión de incidencias" nombre={currentUser?.nombre || "Administración"} tone="plum" />
      <ConnBar />
      <SyncToast />

      {/* Encabezado del folio: una faja continua, no tres tarjetas sueltas.
          Cada cifra vive en un casillero de ancho fijo y nunca empuja a su vecina. */}
      <div className="flex shrink-0 bg-paper border-y border-paper-rule">
        {[["Críticas", stats.crit, "text-bad"], ["Activas", stats.act, "text-warn"], ["Cerradas", stats.cer, "text-good"]].map(([l, v, c]) => (
          <div key={l} className="flex-1 min-w-0 px-3 py-2.5 border-r border-paper-rule last:border-r-0">
            <p className={cx("folio text-[26px] leading-none", c)}>{v}</p>
            <p className="rotulo mt-1 truncate">{l}</p>
          </div>
        ))}
      </div>

      <div className="px-4 pb-2 shrink-0">
        <Segmented tone="plum" value={filtro} onChange={setFiltro}
          options={[["activo","Activas",stats.act],["cerrado","Cerradas",stats.cer],["todas","Todas",tickets.length]]} />
      </div>

      {/* Filtro por área */}
      {Object.keys(areas).length > 0 && (
        <div className="flex gap-1.5 overflow-x-auto px-4 pb-2.5 shrink-0">
          <button onClick={() => setArea("todas")}
            className={cx("clay-btn shrink-0 px-3 min-h-[40px] text-[13px] font-bold uppercase border border-paper-rule",
              area === "todas" ? "bg-stamp text-paper-hi border-transparent" : "bg-paper-hi text-ink-mute")}
            style={{ letterSpacing:".07em" }}>Todas</button>
          {Object.entries(areas).map(([a, n]) => (
            <button key={a} onClick={() => setArea(a)}
              className={cx("clay-btn shrink-0 px-3 min-h-[40px] text-[13px] font-bold uppercase whitespace-nowrap border border-paper-rule",
                area === a ? "bg-stamp text-paper-hi border-transparent" : "bg-paper-hi text-ink-mute")}
              style={{ letterSpacing:".07em" }}>
              {a} <span className="tnum opacity-75">{n}</span>
            </button>
          ))}
        </div>
      )}

      {/* Cada incidencia es un asiento corrido del libro, no una tarjeta suelta:
          se separan por regla, con su número de renglón en la canaleta y el
          código de incidencia como titular. */}
      <div className="scroll-y flex-1 bg-paper border-t-2 border-ink">
        {cargando && <div className="p-4 flex flex-col gap-2">{[0,1,2].map(i => <Skeleton key={i} h={96} />)}</div>}

        {!cargando && lista.length === 0 && (
          <Empty icon="check-circle" title="Sin incidencias acá" sub="No hay tickets que coincidan con este filtro." />
        )}

        {!cargando && lista.map((t, i) => (
          <button key={t.id} onClick={() => { setSel(t); setResol(""); }}
            className={cx("w-full text-left flex a-up focus-ring border-b border-paper-rule clay-press",
              t.val === "M" && t.estado === "Activo" && "filete")}
            style={{ animationDelay:`${i * 35}ms` }}>
            <span className="canaleta w-9 shrink-0 pt-4 text-center leading-none">{String(i + 1).padStart(2, "0")}</span>
            <span className="flex-1 min-w-0 px-3.5 py-3.5">
              <span className="flex items-baseline justify-between gap-2 mb-1.5">
                <span className="folio text-[17px] text-ink truncate">{t.id}</span>
                <Badge tone={t.estado === "Activo" ? (t.val === "M" ? "bad" : "warn") : "gray"}>{t.estado}</Badge>
              </span>
              <span className="block text-[16px] font-bold text-ink leading-tight">{t.obj}</span>
              <span className="block text-[15px] text-ink-mute mt-1 leading-snug">{t.desc}</span>
              {t.item && (
                <span className="flex items-center gap-1.5 mt-2">
                  <Icon name="clipboard" size={13} className="text-ink-mute shrink-0" />
                  <span className="text-[14px] text-ink-mute truncate">{t.item}</span>
                  <Badge tone={t.val === "M" ? "bad" : "warn"} className="ml-auto shrink-0">{VALOR[t.val]?.label || t.val}</Badge>
                </span>
              )}
              <span className="flex items-center gap-2 mt-2.5 flex-wrap">
                <Badge tone={AREA_THEME[t.area]?.tone || "gray"}>{t.area}</Badge>
                {t.isNew && <Badge tone="brand">Nuevo</Badge>}
                <span className="text-[13px] text-ink-mute ml-auto tnum">{t.sup} · {t.fecha}</span>
              </span>
            </span>
          </button>
        ))}
      </div>

      {/* Detalle y resolución */}
      <Sheet open={!!sel} onClose={() => setSel(null)} title={actual?.obj} sub={actual?.id}>
        {actual && (
          <div className="flex flex-col gap-3.5">
            <div className="flex gap-1.5 flex-wrap">
              <Badge tone={AREA_THEME[actual.area]?.tone || "gray"}>{actual.area}</Badge>
              <Badge tone={actual.val === "M" ? "bad" : "warn"}>{VALOR[actual.val]?.label || actual.val}</Badge>
              <Badge tone={actual.estado === "Activo" ? "warn" : "good"}>{actual.estado}</Badge>
            </div>

            <Clay className="p-4">
              <Label className="mb-1.5">Descripción</Label>
              <p className="text-[13px] text-ink-soft leading-relaxed">{actual.desc}</p>
            </Clay>

            <Clay className="p-4">
              {actual.item && <Row k="Ítem del checklist" v={actual.item} />}
              {actual.vig  && <Row k="Vigilador" v={actual.vig} />}
              <Row k="Supervisor" v={actual.sup} />
              <Row k="Registrado" v={actual.fecha} last />
            </Clay>

            {actual.estado === "Activo" ? (
              <>
                <Textarea label="Resolución técnica" value={resol} onChange={e => setResol(e.target.value)} rows={4}
                  placeholder="Describí la acción concreta que resolvió esta incidencia…"
                  hint={<p className="text-[10px] text-ink-faint mt-1.5">Mínimo 5 caracteres.</p>} />
                <Btn full size="lg" variant="success" icon="check-circle" loading={cerrando}
                  disabled={resol.trim().length < 5} onClick={confirmarCierre}>
                  Cerrar incidencia
                </Btn>
              </>
            ) : (
              <div className="bg-good-soft rounded-[16px] px-4 py-3.5">
                <div className="flex items-center gap-2 mb-1">
                  <Icon name="check-circle" size={16} className="text-good-ink" />
                  <p className="text-[12px] font-black text-good-ink">Incidencia resuelta</p>
                </div>
                {actual.resolucion && <p className="text-[11px] text-good-ink/80 leading-relaxed mt-1">{actual.resolucion}</p>}
              </div>
            )}
          </div>
        )}
      </Sheet>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   PANEL DUEÑO — dashboard ejecutivo
═══════════════════════════════════════════════════════════ */
function OwnerPanel() {
  const { kpis: kpisLocal, liveFeed, apiStatus, apiFetch, currentUser, objetivos } = useApp();
  const [apiKpis, setApiKpis] = useState(null);
  const [apiFeed, setApiFeed] = useState(null);
  const [tab, setTab] = useState("tipo");

  useEffect(() => {
    if (apiStatus !== "connected") { setApiKpis(null); setApiFeed(null); return; }
    apiFetch("/api/kpis").then(r => r.json()).then(d => {
      if (!d.ok) return;
      const k = d.kpis;
      const porObjetivo = (k.cumplimiento_objetivos || []).map(o => ({
        ...o, realizadas: o.rondas_realizadas, visitas_meta_mes: o.visitas_meta_mes,
      }));
      const porTipo = {};
      for (const o of porObjetivo) {
        porTipo[o.tipo] = porTipo[o.tipo] || { completadas:0, total:0 };
        porTipo[o.tipo].completadas += o.realizadas;
        porTipo[o.tipo].total       += o.visitas_meta_mes || 0;
      }
      setApiKpis({
        visitas:     porObjetivo.reduce((a, o) => a + o.realizadas, 0),
        metaVisitas: porObjetivo.reduce((a, o) => a + (o.visitas_meta_mes || 0), 0) || 1,
        criticas:    k.tickets.criticos, activas: k.tickets.abiertos, cerradas: k.tickets.cerrados,
        porArea:     k.tickets.por_area, diasProm: k.tickets.dias_promedio_resolucion,
        rondas:      k.rondas, porTipo, porObjetivo,
      });
    }).catch(e => console.warn("[kpis]", e.message));

    apiFetch("/api/actividad?limite=8").then(r => r.json()).then(d => {
      if (!d.ok) return;
      setApiFeed(d.actividad.map(a => ({
        hora: fmtHora(a.fecha_hora),
        sup:  a.supervisor.split(" ")[0][0] + ". " + a.supervisor.split(" ").slice(-1)[0],
        obj:  cortar(a.objetivo, 20),
        tipo: a.tipo === "remota" ? "Remota" : "Presencial",
        ok:   a.tickets === 0, isNew: false,
      })));
    }).catch(() => {});
  }, [apiStatus]);

  const k    = apiKpis || kpisLocal;
  const feed = apiFeed || liveFeed;
  const pct  = Math.round(k.visitas / k.metaVisitas * 100);

  const TIPO_COLOR = { Barrios:"#2D4175", Industrias:"#1F6B4A", Locales:"#8A5A12" };

  return (
    <div className="flex flex-col h-full">
      <PanelHeader icon="chart" rol="Dashboard ejecutivo" nombre={currentUser?.nombre || "Gerencia"} tone="warn" />
      <ConnBar />
      <SyncToast />

      <div className="scroll-y flex-1 px-4 pb-5 flex flex-col gap-3.5">
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <h2 className="display text-[20px] text-ink first-letter:uppercase leading-tight">
              {new Date().toLocaleDateString("es-AR", { month:"long", year:"numeric" })}
            </h2>
            <p className="rotulo mt-1.5">Ciclo de cumplimiento</p>
          </div>
          <div className="flex items-center gap-2 px-3 py-2 border border-paper-rule bg-paper-hi shrink-0">
            <Dot tone="bad" pulse />
            <span className="rotulo">En vivo</span>
          </div>
        </div>

        {/* Cobertura de visitas */}
        <Clay className="p-4">
          <Label className="mb-3">Cobertura de visitas mensuales</Label>
          <p className="folio text-[56px] text-ink leading-none">{pct}<span className="text-[26px] text-ink-mute">%</span></p>
          <p className="text-[16px] text-ink-mute mt-2 leading-snug tnum">
            {k.visitas} visitas realizadas sobre {k.metaVisitas} planificadas
          </p>
          <div className="mt-3"><Bar value={k.visitas} max={k.metaVisitas} color="#2D4175" height={12} /></div>
          {k.rondas && (
            <div className="flex gap-1.5 mt-3">
              <Badge tone="good">{k.rondas.presenciales} presenciales</Badge>
              <Badge tone="warn">{k.rondas.remotas} remotas</Badge>
            </div>
          )}
        </Clay>

        {/* Incidencias: renglones del libro, no un mosaico de tarjetas.
            Cada cifra ocupa su casillero fijo y no mueve al renglón vecino. */}
        <Clay>
          <div className={cx("flex items-baseline gap-3 px-4 py-3 border-b border-paper-rule", k.criticas > 0 && "bg-bad-soft filete")}>
            <span className={cx("folio text-[40px] leading-none casillero w-[2ch]", k.criticas > 0 ? "text-bad" : "text-good")}>{k.criticas}</span>
            <span className="min-w-0">
              <span className={cx("block rotulo", k.criticas > 0 ? "text-bad-ink" : "text-good-ink")}>Críticas</span>
              <span className={cx("block text-[15px] mt-1", k.criticas > 0 ? "text-bad-ink" : "text-good-ink")}>
                {k.criticas > 0 ? "requieren atención" : "todo en orden"}
              </span>
            </span>
          </div>
          <div className="flex items-baseline gap-3 px-4 py-3 border-b border-paper-rule">
            <span className="folio text-[26px] leading-none casillero w-[2ch] text-warn-ink">{k.activas}</span>
            <span className="rotulo">Tickets activos</span>
          </div>
          <div className="flex items-baseline gap-3 px-4 py-3">
            <span className="folio text-[26px] leading-none casillero w-[2ch] text-good">{k.cerradas}</span>
            <span className="rotulo">Resueltos</span>
          </div>
        </Clay>

        {k.diasProm > 0 && (
          <Clay className="px-4 py-3 flex items-baseline gap-3">
            <span className="folio text-[26px] leading-none casillero w-[2ch] text-ink">{k.diasProm}</span>
            <span className="rotulo">Días promedio de resolución</span>
          </Clay>
        )}

        {/* Cumplimiento */}
        <Clay className="p-4">
          <div className="flex items-center justify-between mb-3">
            <Label>Cumplimiento</Label>
            <div className="clay-inset flex gap-1 p-1">
              {[["tipo","Por tipo"],["obj","Por objetivo"]].map(([kk, l]) => (
                <button key={kk} onClick={() => setTab(kk)}
                  className={cx("px-2.5 py-1 rounded-[10px] text-[10px] font-black transition-all",
                    tab === kk ? "bg-brand-600 text-paper-hi" : "text-ink-mute")}>{l}</button>
              ))}
            </div>
          </div>

          {tab === "tipo" ? (
            <div className="flex flex-col gap-3.5">
              {Object.entries(k.porTipo || {}).map(([tipo, d]) => {
                const p = d.total ? Math.round(d.completadas / d.total * 100) : 0;
                return (
                  <div key={tipo}>
                    <div className="flex justify-between items-center mb-1.5">
                      <span className="text-[12px] font-bold text-ink-soft">{tipo}</span>
                      <span className="text-[11px] text-ink-mute tnum">
                        {d.completadas}/{d.total} · <span className="font-black text-ink">{p}%</span>
                      </span>
                    </div>
                    <Bar value={d.completadas} max={d.total || 1} color={TIPO_COLOR[tipo] || "#2D4175"} height={9} />
                  </div>
                );
              })}
            </div>
          ) : (
            <div className="flex flex-col gap-3">
              {(k.porObjetivo || []).map(o => {
                const meta = o.visitas_meta_mes || 0;
                const p = meta ? Math.round(o.realizadas / meta * 100) : 0;
                return (
                  <div key={o.id}>
                    <div className="flex justify-between items-center gap-2 mb-1.5">
                      <span className="text-[11px] font-bold text-ink-soft truncate flex-1">{o.nombre}</span>
                      <span className="text-[10px] text-ink-mute tnum shrink-0">{o.realizadas}/{meta}</span>
                    </div>
                    <Bar value={o.realizadas} max={meta || 1} color={p >= 100 ? "#1F6B4A" : p >= 60 ? "#2D4175" : "#8A5A12"} height={7} />
                  </div>
                );
              })}
            </div>
          )}
        </Clay>

        {/* Tickets por área */}
        {k.porArea?.length > 0 && (
          <Clay className="p-4">
            <Label className="mb-3">Tickets abiertos por área</Label>
            <div className="flex flex-col gap-2">
              {k.porArea.map(a => (
                <div key={a.area_responsable} className="flex items-center gap-2.5">
                  <Badge tone={AREA_THEME[a.area_responsable]?.tone || "gray"}>{a.area_responsable}</Badge>
                  <div className="flex-1"><Bar value={parseInt(a.cantidad)} max={Math.max(...k.porArea.map(x => parseInt(x.cantidad)))} color="#4B3A7A" height={7} /></div>
                  <span className="text-[11px] font-black text-ink tnum w-4 text-right">{a.cantidad}</span>
                </div>
              ))}
            </div>
          </Clay>
        )}

        {/* Feed en vivo */}
        <Clay className="p-4">
          <div className="flex items-center justify-between mb-3">
            <Label>Actividad en tiempo real</Label>
            <div className="flex items-center gap-1.5"><Dot tone="good" pulse /><span className="text-[10px] font-black text-good-ink">Live</span></div>
          </div>
          {feed.length === 0
            ? <Empty icon="activity" title="Sin actividad" sub="Las rondas aparecerán acá al guardarse." />
            : feed.map((a, i) => (
              <div key={i} className={cx("flex items-center gap-2.5 py-2.5", i < feed.length - 1 && "border-b border-paper-rule")}>
                <span className="text-[10px] text-ink-faint font-mono w-9 shrink-0 tnum">{a.hora}</span>
                <Dot tone={a.tipo === "Presencial" ? "good" : "warn"} />
                <div className="flex-1 min-w-0">
                  <p className="text-[11px] font-bold text-ink truncate">
                    {a.isNew && <span className="text-brand-600">● </span>}{a.sup} → {a.obj}
                  </p>
                  <p className="text-[10px] text-ink-faint">{a.isNew ? "Recién · " : ""}{a.tipo}{!a.ok ? " · con incidencia" : ""}</p>
                </div>
                <Icon name={a.ok ? "check-circle" : "alert"} size={15} className={a.ok ? "text-good" : "text-warn"} />
              </div>
            ))}
        </Clay>

        <p className="text-center text-[10px] text-ink-faint pb-1">ASISA · Sistema de Supervisión v3.0</p>
      </div>
    </div>
  );
}

function PhoneFrame({ children }) {

      <div className="w-full" style={{ maxWidth:"392px" }}>
        <div style={{
          background:"#DDE0E4", overflow:"hidden", height:"784px",
          border:"1px solid #101A33", position:"relative",
          display:"flex", flexDirection:"column",
          boxShadow:"0 2px 0 rgba(0,0,0,.45), 0 26px 50px -18px rgba(0,0,0,.6)",
        }}>
          {/* Barra de estado */}
          <div className="flex justify-between items-center px-5 pt-2.5 pb-1.5 shrink-0 relative bg-paper border-b border-paper-rule">
            <span className="folio text-[12px] text-ink">{fmtHora(t)}</span>
            <div className="absolute left-1/2 -translate-x-1/2 top-2 w-[84px] h-[22px] bg-ink" />
            <div className="flex items-center gap-1.5 text-ink-soft">
              <Icon name={offline ? "wifi-off" : "wifi"} size={14} className={offline ? "text-bad" : ""} />
              <svg width="24" height="12" viewBox="0 0 24 12" aria-hidden="true">
                <rect x="0.5" y="0.5" width="19" height="11" fill="none" stroke="currentColor" strokeWidth="1.2" opacity=".5" />
                <rect x="2" y="2" width="15" height="8" fill="currentColor" />
                <rect x="21" y="4" width="2" height="4" fill="currentColor" opacity=".5" />
              </svg>
            </div>
          </div>

          <div className="flex-1 overflow-hidden flex flex-col">{children}</div>

          <div className="flex justify-center py-2 shrink-0 bg-paper border-t border-paper-rule">
            <div className="w-32 h-[3px] bg-ink/30" />
          </div>
        </div>
      </div>
      <p className="rotulo mt-4 text-navy-400">ASISA · Libro de novedades · Prototipo</p>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   RAÍZ
═══════════════════════════════════════════════════════════ */
function AppInner() {
  const { currentUser } = useApp();
  return (
    <PhoneFrame>
      {!currentUser                     && <LoginScreen />}
      {currentUser?.rol === "supervisor"&& <SupervisorPanel />}
      {currentUser?.rol === "admin"     && <AdminPanel />}
      {currentUser?.rol === "dueno"     && <OwnerPanel />}
    </PhoneFrame>
  );
}

function App() {
  return <AppProvider><AppInner /></AppProvider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
